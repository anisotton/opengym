# openGym HTTP API — hand-written OpenAPI 3.1 spec.
# Source of truth: api/server.js (a single framework-free Node file). Every route the
# server registers is documented here; if you add a route there, add it here too.
# Browsable version: https://opengym.duarte-santos.ch/api.html
openapi: 3.1.0

info:
  title: openGym API
  version: 0.0.0-alpha
  summary: Passkey (WebAuthn) auth + per-user state storage for openGym
  description: |
    The backend of [openGym](https://opengym.duarte-santos.ch) — a free, open-source
    gym & body-weight tracker. One Node file, no framework, JSON-file storage,
    HMAC-signed session cookies.

    ### Authentication
    Sign-in is by **passkey** (WebAuthn, via `@simplewebauthn/server`). A successful
    `register/verify` or `login/verify` sets the session cookie; every authenticated
    route then works with that cookie. The paired mobile app has no shared cookie jar,
    so it redeems a short pairing code (`/api/pair/redeem`) for the *same* signed token
    and sends it as `Authorization: Bearer <token>` instead.

    An instance started with `PASSWORD_LOGIN=1` also offers **e-mail/name-and-password
    sign-in** (tag `password`): opt-in per profile, scrypt-hashed, throttled. The
    identifier is the account's one verified e-mail (tag `email`, `/api/account/email`
    — confirmed by a mailed link, same as passkey signup) or, for a profile from before
    e-mail was required, its name. A forgotten password is reset either with an
    admin-issued one-time code or, self-serve, by redeeming the recovery link
    (`/api/recover/redeem`) with a new password instead of pairing a device (ISO-1596).
    Its routes set exactly the same cookie. With the flag off (the default) every one of
    them answers 404 — `/api/account/email` and the rest of the `email` tag stay live
    either way, since they are not about signing in with a password.

    ### Throttling
    The `password` routes are counted per client address: at most 60 requests a minute
    across them, and wrong answers (a password, a reset code, an invite code on password
    signup, an e-mail address already in use) pause the address after 20 for 30 s,
    doubling up to 15 min. Wrong passwords also pause the *account* they were tried
    against after 5, for 1 min doubling up to 1 h — the same pause whether the account
    was named by its name or its e-mail — and an identifier that names no account is
    paused the same way, as typed. A password check counts from the moment it
    starts, so checks sent at once get no more tries than checks sent one by one. A
    paused caller gets `429 {"error": …, "code": "locked", "retryAfter": <s>}` with a
    `Retry-After` header. Passkey sign-up and sign-in and the pairing routes are not
    throttled. The two routes that redeem a one-time device link (tag `passkeys`) share
    the per-address budget, and wrong codes pause the address for link redemption only,
    after 20, the way wrong reset codes do. Adding or removing a passkey in Settings
    (`POST /api/account/passkeys/options`, `DELETE /api/account/passkeys`) and making a
    device code (`POST /api/account/device-link`) spend the per-address budget too, and a
    current password given there as proof counts like one given at sign-in.
    The address is the socket's, or with `TRUST_PROXY=1` the one a trusted proxy put in
    `CF-Connecting-IP` / the last `X-Forwarded-For` entry / `X-Real-IP`; IPv6 clients are
    counted by /64. Counters live in memory and reset on restart.

    ### Sessions
    The cookie/bearer value is `<payload>.<hmac>` where the payload is
    `<uid>:<expiry-ms>:<session-version>`, signed with a per-instance secret
    (HMAC-SHA256). Sessions last `SESSION_DAYS` (default 90). `POST /api/logout/all`
    bumps the user's session version, which invalidates every token ever issued for
    the account.

    ### CSRF
    State-changing browser requests must come from the app's own origin. The server
    checks `Sec-Fetch-Site` (falling back to `Origin` vs the configured `ORIGIN`);
    a mismatch is refused with `403 {"error":"cross-origin request refused"}` on any
    non-GET route. Exempt: passkey sign-up and sign-in (`register/options`,
    `register/verify`, `login/options`, `login/verify`) and `pair/redeem`, each of which
    carries its own one-shot credential in the body, and any request authenticated with a
    Bearer token.
    The password routes are **not** exempt: a hostile page knows a valid name and
    password of its own, and could otherwise sign a visitor into it (login CSRF).
    Neither are the device-link routes: a link is redeemed on the app's own origin,
    the only one a passkey can be created for.
    `GET /api/auth/google/start` and `GET /api/auth/google/callback` need no exemption:
    every GET is already allowed through, which is what lets the callback work at all
    — it is itself a cross-site GET navigation coming back from Google. Its own `state`
    parameter, checked against a signed cookie the start route set, is that flow's CSRF
    defense. `POST /api/register/google` and `DELETE /api/account/google` are **not**
    exempt, same login-CSRF reasoning as the password routes.

    ### Environment-dependent behavior
    - `INVITE_ONLY=1` — registration requires a valid invite code (minted by an admin).
    - `ALLOW_GUEST=0` — hides the client-side "continue without account" mode; the
      server merely reports the flag via `GET /api/config` (guest mode never talks to
      this API at all).
    - `ADMIN_UIDS=<uid>,<uid>` — user ids treated as admins (a `"admin": true` flag on
      the user record in `db.json` works too). Admins get the `/api/admin/*` routes.
    - `AUDIT_LOG` (default on), `AUDIT_MAX` (default 5000 events), `AUDIT_DAYS`
      (default 90), `AUDIT_IP` (`off` | `net` | `full`, default off) — shape the audit
      log served by `GET /api/admin/audit`.
    - `PASSWORD_LOGIN=1` — adds the `password` routes and `password_login: true` in
      `GET /api/config`. Off by default.
    - `GOOGLE_CLIENT_ID` + `GOOGLE_CLIENT_SECRET` together add the `google` routes and
      `google_login: true` in `GET /api/config`; either missing, every one of them is a
      404. `GOOGLE_REDIRECT_URI` (default `${APP_URL}/api/auth/google/callback`) is only
      for an instance whose public API address differs from `APP_URL` — it has to match
      the redirect URI registered on the Google OAuth client exactly.
    - `MAIL_PROVIDER` / `MAIL_API_KEY` / `MAIL_FROM` — the transactional e-mail driver (tag
      `email`). Without `MAIL_API_KEY` (every instance until configured, and every test) the
      confirmation and recovery mail is written to the API's own log instead of sent.
      `APP_URL` (default: `ORIGIN`) is what a mailed link points at.
    - `DEFAULT_LANG` (e.g. `pt-BR`; unset by default) — `default_lang` in `GET /api/config`,
      the language of the sign-in screen and of every profile that never picked one.
    - `TRUST_PROXY=1` — the throttle reads the client address from proxy headers (set by
      the bundled `docker-compose.yml`, where only the web container can reach the API).
    - `STRIPE_API_KEY` (a restricted key, `rk_…`) and `STRIPE_WEBHOOK_SECRET` together turn on the
      `billing` routes (tag `billing`); either missing, every one of them (except
      `GET /api/billing/status`) is a 404 and `PUT /api/data` never answers 402. `STRIPE_PRICE_MONTHLY`
      / `STRIPE_PRICE_QUARTERLY` / `STRIPE_PRICE_YEARLY` name the three plans' recurring Stripe
      Prices; `STRIPE_PRICE_INTRO`, if set, is a one-time Price added to a first-ever checkout for
      that account so the first month is billed at it instead of the plan's own rate.
    - `MEDIA_UPLOADS` (default on; `0` removes the `media` routes and the `media` block of
      `GET /api/config`), `MEDIA_QUOTA_MB` (200 per profile, `0` = no cap),
      `MEDIA_IMAGE_MAX_MB` (2), `MEDIA_GIF_MAX_MB` (8), `MEDIA_VIDEO_MAX_MB` (40),
      `MEDIA_VIDEO_MAX_SEC` (60), `MEDIA_GC_GRACE_DAYS` (14), `MEDIA_UPLOADS_PER_HOUR` (600
      per profile), `MEDIA_MIN_FREE_MB` (512, `0` = no floor) — photos and videos of custom
      exercises (tag `media`). Every MB here is 2^20 bytes.

    ### Conventions
    - Every response body is JSON with `Cache-Control: no-store`. The one exception is
      `GET /api/media/{hash}`, which answers with the stored file itself
      (`Cache-Control: private, no-store`).
    - Errors are always `{"error": "<human-readable message>"}`. The `password`, throttle and
      `media` routes add a stable `code` for the client to word in its own language.
    - Unknown method+path pairs return `404 {"error":"not found"}`; an unhandled
      exception returns `500 {"error":"server error"}`.
    - Request bodies are parsed as JSON regardless of Content-Type. A body that does
      not parse, or parses to anything but an object (`null`, a string, an array), is
      `400 {"error":"invalid json"}` on every route that reads one; an empty body counts
      as `{}`. A body over 5 MiB is `413 {"error":"body too large"}`; the rest of the
      upload is discarded so the answer reaches the client.
    - CORS: the request's `Origin` is reflected in `Access-Control-Allow-Origin`
      **without** `Allow-Credentials` — cross-origin callers can only ever
      authenticate with a Bearer token, never with the cookie.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: openGym
    url: https://gitlab.com/DuarteSantos8/opengym

servers:
  - url: /
    description: Same origin as the openGym web app (the normal deployment)
  - url: https://opengym.example.com
    description: Your self-hosted instance

tags:
  - name: meta
    description: Health and public configuration
  - name: auth
    description: Passkey (WebAuthn) registration and login, sessions
  - name: pairing
    description: Mobile-app pairing (code from a signed-in browser tab)
  - name: password
    description: >-
      Optional name-and-password sign-in (`PASSWORD_LOGIN=1`). Every route here is a 404
      while the flag is off.
  - name: passkeys
    description: >-
      More than one passkey on a profile: list, add, rename, remove — and one-time device
      links, which let another device of the same person add a passkey of its own.
  - name: email
    description: >-
      Verified e-mail and password-less recovery. Every signup from here on requires an
      e-mail address, confirmed by a one-time link (24h); "I lost my access" sends a second
      kind of one-time link (15min) that hands back a device-link code, redeemed the same way
      as any other (tag `passkeys`). Independent of `PASSWORD_LOGIN` — this is the address
      every profile has, not the optional, never-mailed-to sign-in identifier that flag adds
      (tag `password`).
  - name: google
    description: >-
      "Sign in with Google" (OpenID Connect) — login, signup, linking an existing profile
      and unlinking. Every route here is a 404 unless the instance sets both
      `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET`.
  - name: data
    description: Per-user state sync (the whole app state as one JSON blob)
  - name: push
    description: Web Push (VAPID) subscriptions, rest-timer and test pushes
  - name: activity
    description: Live-workout presence heartbeat
  - name: admin
    description: Admin dashboard — requires an admin session (`ADMIN_UIDS` or `admin:true`)
  - name: teacher
    description: >-
      Teacher/student roles, the link between them and workout assignments (ISO-1594/ISO-1609).
      A teacher only ever reads an allowlisted projection of a student's state
      (`GET /api/teacher/student`), never the raw document — never media, the Coach, settings,
      or body weight unless the student has separately opted that in. A student links to a
      teacher by redeeming a one-time class invite code; either side can end the link at any
      time, which erases the teacher's notes about that student and closes out any active
      assignment. The admin-only `POST /api/admin/user/role` (tag `admin`) grants or revokes the
      role itself.
  - name: media
    description: >-
      The photo, GIF or video of a user's own custom exercise, and the photos and videos
      attached to a logged workout. Stored per profile (one quota for both) and named
      by the SHA-256 of its bytes; the state only carries a `MediaRef`. Every route here is a
      404 when the instance runs with `MEDIA_UPLOADS=0`.
  - name: coach
    description: >-
      AI Coach — plans, reviews and debriefs. Every route here answers 503 unless the
      instance has the Coach switched on and a provider connected.
  - name: billing
    description: >-
      Stripe Checkout, Customer Portal and webhook (Phase 3). Every route here is a 404
      unless the instance sets `STRIPE_API_KEY` and `STRIPE_WEBHOOK_SECRET`, except
      `GET /api/billing/status`, which answers `{"enabled":false}` instead. The app never
      touches card data — Checkout and the Portal are Stripe's own hosted pages.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Health check
      description: |
        Always public. Pings the database with a short timeout (ISO-1400) — used by the
        compose healthcheck and by external uptime monitors. Reports whether the database
        answered, nothing about account counts.
      security: []
      responses:
        '200':
          description: The server and its database are both up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  db: { type: string, const: ok }
              example: { ok: true, db: ok }
        '503':
          description: The database did not answer in time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  db: { type: string, const: down }
              example: { ok: false, db: down }

  /api/config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: Instance configuration
      description: |
        The flags the login screen needs before anyone is signed in. Both reflect
        environment variables on the server (`INVITE_ONLY`, `ALLOW_GUEST`), and so does
        `password_login`, which is there only when `PASSWORD_LOGIN=1`, and `default_lang`,
        which is there only when `DEFAULT_LANG` is set.

        `legal_version` is always there, for everybody: the version of the Terms of Use and
        Privacy Policy in force (ISO-1390). Signup refuses any other, so an app whose bundle
        carries a different one knows to ask for an update.

        `media` is there unless the instance runs with `MEDIA_UPLOADS=0`, for everybody: the
        caps are not a secret, and its absence is how the app knows this server does not
        store photos and videos at all.

        `google_login` (tag `google`) is there, and true, only when the instance sets both
        `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET`; its absence is how the app knows to
        hide the "Sign in with Google" button entirely, the same shape as `password_login`.

        A caller with a valid session also gets a `coach` key: the block when the
        instance has the AI Coach switched on **and** a provider connected, and `null`
        when it has not. A caller with no session gets no key at all — the block names
        the provider this instance talks to, which is the same fact
        `GET /api/coach/disclosure` will not hand out unauthenticated.

        The key is always present for a session, `null` included, so a client that
        caches this answer can tell "no Coach on this instance" from "you were not
        signed in when you asked" and knows whether asking again would change it.
      security: []
      responses:
        '200':
          description: Instance flags, plus the Coach block for a signed-in caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_only:
                    type: boolean
                    description: When true, registration requires a valid invite code.
                  allow_guest:
                    type: boolean
                    description: >-
                      When false, the client hides "continue without account".
                      Guest mode is purely client-side and never calls this API.
                  legal_version:
                    type: string
                    example: '2026-10-18'
                    description: >-
                      Always present, public. The Terms of Use / Privacy Policy version in
                      force; `termsVersion` at signup must equal it (ISO-1390).
                  coach:
                    description: >-
                      Present for a signed-in caller and absent otherwise; `null` when this
                      instance has no Coach enabled and connected. Every Coach entry point
                      in the client hangs off the block being there.
                    type: ['object', 'null']
                    properties:
                      enabled: { type: boolean, const: true }
                      provider:
                        type: string
                        description: Provider id, e.g. `anthropic`, `compatible`, `fixture`.
                      providerLabel: { type: string, description: Human-readable provider name. }
                      authMode:
                        type: string
                        enum: [instance, profile]
                        description: Whose credential the jobs spend.
                      community:
                        type: boolean
                        description: Whether "compare with others" is offered on this instance.
                  password_login:
                    type: boolean
                    const: true
                    description: >-
                      Present (and true) only when the instance runs with
                      PASSWORD_LOGIN=1 — the client then offers name-and-password
                      sign-in next to passkeys.
                  google_login:
                    type: boolean
                    const: true
                    description: >-
                      Present (and true) only when the instance sets both
                      GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET — the client then offers
                      "Sign in with Google" (tag `google`).
                  default_lang:
                    type: string
                    example: pt-BR
                    description: >-
                      Present only when the instance runs with DEFAULT_LANG set: the
                      language tag the sign-in screen, and every profile that has never
                      picked a language in Settings, starts in. A profile's own choice
                      always wins; a tag the app has no translation for is ignored.
                  media:
                    $ref: '#/components/schemas/MediaConfig'
              examples:
                anonymous: { value: { invite_only: true, allow_guest: false, legal_version: '2026-10-18' } }
                signedInNoCoach: { value: { invite_only: true, allow_guest: false, legal_version: '2026-10-18', coach: null } }
                signedIn:
                  value:
                    invite_only: true
                    allow_guest: false
                    legal_version: '2026-10-18'
                    coach: { enabled: true, provider: compatible, providerLabel: "OpenAI-compatible endpoint", authMode: instance, community: false }
                passwordLogin: { value: { invite_only: true, allow_guest: false, legal_version: '2026-10-18', password_login: true } }
                media: { value: { invite_only: false, allow_guest: true, legal_version: '2026-10-18', media: { imageMB: 2, gifMB: 8, videoMB: 40, videoSec: 60, quotaMB: 200, workouts: true } } }

  /api/client-event:
    post:
      tags: [meta]
      operationId: postClientEvent
      summary: Report a classified WebAuthn ceremony failure (ISO-1480)
      description: |
        Fire-and-forget beacon sent with `navigator.sendBeacon`, never by the paired mobile
        app. `register`, `login`, `device-link` and the two Settings proof-of-ownership
        flows (`settings-add-passkey`, `password-confirm`) can all have their passkey
        prompt refused outright — an untrusted TLS certificate, a non-secure origin, no
        screen lock — which used to look identical to the person simply dismissing the
        prompt. This writes `auth.webauthn.fail` to the audit log so that case shows up
        there instead of as silence.

        Every field is clamped to a small allowlist before it is logged: an unrecognized
        `flow`/`kind` becomes `unknown`/`other`, `elapsedMs` is clamped to
        `[0, 60000]`, and nothing free-text (an error message, a credential id) is ever
        accepted. Always `200 {}`, whatever the body contained — a dropped or malformed
        beacon must never become an error the UI has to react to. Rate-limited by the
        shared per-address burst budget only (60/min); there is no secret here for a
        per-kind pause to guard.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                flow:
                  type: string
                  enum: [register, login, device-link, settings-add-passkey, password-confirm]
                step: { type: string, maxLength: 24 }
                kind:
                  type: string
                  enum: [cert-untrusted, insecure-context, instant-refusal, unsupported, other]
                elapsedMs: { type: number }
                isSecureContext: { type: boolean }
            example: { flow: login, step: assertion, kind: cert-untrusted, elapsedMs: 42, isSecureContext: true }
      responses:
        '200':
          description: Always.
          content:
            application/json:
              schema: { type: object }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who am I?
      description: |
        Resolves the current session to a user. A paired phone (bearer token) whose token is
        past half of `SESSION_DAYS` also receives a fresh `token` to use from now on; it carries
        the account's current session version, so "sign out everywhere" revokes it like the old
        one. Cookie sessions never get one.

        `email`/`emailVerified`/`needsEmail` (tag `email`) are always present (ISO-1596):
        `email` is the one verified address every account has — confirmed or not — regardless of
        `PASSWORD_LOGIN`. Before ISO-1596 these were left out while `PASSWORD_LOGIN` was on,
        because `email` meant a second, unrelated, never-mailed sign-in address (tag `password`)
        that collided with this one at the same field; that address no longer exists.

        `termsVersion`/`termsAcceptedAt`/`needsTerms` (ISO-1390) are always present,
        `PASSWORD_LOGIN` included. `needsTerms` is true whenever the accepted version is not the
        one in force (`legal_version` in `GET /api/config`) — an account from before ISO-1390
        has accepted none, so it is true with both other fields `null`.

        `google` (tag `google`) is always present too, regardless of `google_login`: `null`
        for a profile with no linked Google identity, otherwise its e-mail and when it was
        linked. An instance that switches Google off again still shows an existing link
        honestly here — it just can no longer be removed or added through the (then 404)
        `google` routes.
      responses:
        '200':
          description: A valid session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
                  email: { oneOf: [{ type: string }, { type: 'null' }], description: 'Always present. The account''s verified e-mail; null for an account from before ISO-1397 that has not added one yet.' }
                  emailVerified: { type: boolean, description: 'Always present.' }
                  needsEmail: { type: boolean, description: 'Always present — an account from before ISO-1397 with no e-mail yet.' }
                  termsVersion: { oneOf: [{ type: string }, { type: 'null' }], description: 'Always present. The Terms/Privacy version this account accepted; null if none.' }
                  termsAcceptedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }], description: 'Always present. When that version was accepted; null if never.' }
                  needsTerms: { type: boolean, description: 'Always present. True unless termsVersion is the version in force.' }
                  google:
                    description: 'Always present. null for a profile with no linked Google identity.'
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          email: { oneOf: [{ type: string }, { type: 'null' }] }
                          linkedAt: { type: string, format: date-time }
                  token: { type: string, description: 'Bearer sessions past half their lifetime only — the renewed token.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/register/options:
    post:
      tags: [auth]
      operationId: registerOptions
      summary: 'Start passkey registration (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialCreationOptions` (from
        `@simplewebauthn/server`'s `generateRegistrationOptions`) plus a challenge id
        `cid`. The client passes `options` to
        `navigator.credentials.create()` (or `@simplewebauthn/browser`'s
        `startRegistration`) and sends the result to `/api/register/verify` together
        with the `cid`. Challenges are one-shot and expire after 5 minutes.

        `email` is required and checked for uniqueness here (case-insensitively; an
        address already in use pauses the caller's address the same way `POST
        /api/account/email` does, tag `email`).

        `birthDate` is required (ISO-1521): missing is `400 birth-date-required`, not a date is
        `400 birth-date-invalid`, and one that gives an age under 18 as of now is `400 underage`
        — checked right after `termsVersion`, before the e-mail. Signup is refused outright for a
        minor; existing accounts are unaffected.

        `termsVersion` is required and must equal `legal_version` from `GET /api/config`
        (ISO-1390): missing, not a string or blank is `400 terms-required`; any other version
        is `400 terms-version-stale` (the app's bundled texts are out of date). It is checked
        before the birth date and the e-mail, and recorded on the account by `/api/register/verify`.

        CSRF-exempt (the challenge is the credential). No session required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, birthDate, termsVersion]
              properties:
                name:
                  type: string
                  maxLength: 40
                  description: Display name for the new profile (trimmed, max 40 chars).
                email:
                  type: string
                  maxLength: 254
                  description: Required, unique (case-insensitively). Confirmed by mail after step 2.
                termsVersion:
                  type: string
                  description: Required. The Terms/Privacy version the person accepted; must be the one in force.
                birthDate:
                  type: string
                  description: 'Required, `YYYY-MM-DD`. Not in the future, not implausibly old, and 18+ as of now.'
                code:
                  type: string
                  description: >-
                    Invite code — required (and validated) only when the instance
                    runs with INVITE_ONLY. Compared case-insensitively.
            example: { name: "Ada", email: "ada@example.com", birthDate: "1990-05-05", termsVersion: "2026-10-18", code: "3F9C21A07B54D688" }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid:
                    type: string
                    description: One-shot challenge id, echo it back to /api/register/verify.
                  options:
                    $ref: '#/components/schemas/WebAuthnRegistrationOptions'
        '400':
          description: '`name` missing/empty, `termsVersion` missing (`terms-required`) or not the current one (`terms-version-stale`), `birthDate` missing (`birth-date-required`), not a date (`birth-date-invalid`) or under 18 (`underage`), or `email` missing/invalid.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                name: { value: { error: "name required" } }
                termsRequired: { value: { error: "update the app to accept the terms", code: "terms-required" } }
                termsStale: { value: { error: "these terms are not the current ones — update the app", code: "terms-version-stale" } }
                birthDateRequired: { value: { error: "a birth date is required", code: "birth-date-required" } }
                birthDate: { value: { error: "that is not a date", code: "birth-date-invalid" } }
                underage: { value: { error: "Brilhart Fitness is for people 18 and older", code: "underage" } }
                email: { value: { error: "that is not an e-mail address", code: "email-invalid" } }
        '403':
          description: Instance is invite-only and the code is missing, used, or revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required" }
        '409':
          description: Another profile already uses this e-mail address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already uses this e-mail address", code: "email-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: 'Finish passkey registration (WebAuthn ceremony, step 2)'
      description: |
        Verifies the authenticator's attestation response against the stored
        challenge (`verifyRegistrationResponse`), creates the user + credential, and
        signs the caller in (sets the session cookie). On an invite-only instance the
        invite is re-checked and burned here; the e-mail from step 1 is re-checked for
        uniqueness too. A confirmation token (24h, tag `email`) is minted in the same
        transaction as the account and mailed right after it commits. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/register/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnRegistrationCredential'
      responses:
        '200':
          description: Registered and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                Session cookie (`__Host-gymsid` on HTTPS deployments, `gymsid` over
                plain http). HttpOnly, SameSite=Lax, Max-Age = SESSION_DAYS.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            Challenge expired/replayed, or the attestation did not verify (wrong
            origin/RP ID, malformed response…). The message is human-readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "challenge expired — try again" }
        '403':
          description: Invite-only and the code became invalid since step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invite code is no longer valid — ask for a new one" }
        '409':
          description: This credential id is already registered, or the e-mail was taken since step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                credential: { value: { error: "credential already registered" } }
                email: { value: { error: "another profile already uses this e-mail address", code: "email-taken" } }

  /api/login/options:
    post:
      tags: [auth]
      operationId: loginOptions
      summary: 'Start passkey login (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialRequestOptions`
        (`generateAuthenticationOptions` with an empty `allowCredentials` — discoverable
        credentials / resident keys are required at registration, so the browser offers
        the user their passkeys itself) plus a one-shot challenge id `cid`.
        CSRF-exempt. Takes no request body.
      security: []
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  options:
                    $ref: '#/components/schemas/WebAuthnAuthenticationOptions'

  /api/login/verify:
    post:
      tags: [auth]
      operationId: loginVerify
      summary: 'Finish passkey login (WebAuthn ceremony, step 2)'
      description: |
        Verifies the assertion (`verifyAuthenticationResponse`), updates the signature
        counter, and signs the caller in (sets the session cookie). CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/login/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnAuthenticationCredential'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Challenge expired/replayed, or the assertion did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "not verified" }
        '403':
          description: The account has been disabled by an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled" }
        '404':
          description: The passkey's credential id is unknown to this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown passkey — create a profile first" }
        '500':
          description: Credential exists but its user record is missing (corrupt db).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "user missing" }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (this device)
      description: >-
        Clears the session cookie. Always succeeds — an invalid or missing session is
        a no-op. The token itself stays cryptographically valid until it expires; use
        /api/logout/all to revoke tokens.
      security: []
      responses:
        '200':
          description: Cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/logout/all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sign out everywhere
      description: |
        Bumps the account's session version, which invalidates **every** cookie and
        Bearer token ever issued for it — on every device, including a copy someone
        walked off with. Passkeys are untouched; signing back in works immediately.
        Also clears the caller's own cookie. Unredeemed pairing codes for the account
        are voided too.
      responses:
        '200':
          description: All sessions revoked.
          headers:
            Set-Cookie:
              description: Expires the caller's session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pair/create:
    post:
      tags: [pairing]
      operationId: pairCreate
      summary: Mint a pairing code for the mobile app
      description: |
        Called from an already signed-in browser tab (Settings → "Pair the mobile
        app"). Returns an 8-character code (alphabet without 0/O/1/I) the phone
        redeems within 5 minutes via /api/pair/redeem. One-shot.
      responses:
        '200':
          description: A fresh pairing code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 8 chars from ABCDEFGHJKLMNPQRSTUVWXYZ23456789.
              example: { code: "K7WQ2MZP" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pair/redeem:
    post:
      tags: [pairing]
      operationId: pairRedeem
      summary: Redeem a pairing code for a Bearer token
      description: |
        Called from the mobile app with the code shown in the browser. No session
        required — the code *is* the credential (one-shot, 5-minute TTL). Returns the
        same HMAC-signed session token the cookie would carry; the app sends it as
        `Authorization: Bearer <token>` from then on. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The pairing code (case-insensitive).
            example: { code: "K7WQ2MZP" }
      responses:
        '200':
          description: Paired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed session token, valid for SESSION_DAYS.
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            Code unknown, already used, expired — or the account behind it is gone or
            disabled (deliberately the same message for all of these).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid or expired code" }

  /api/login/password:
    post:
      tags: [password]
      operationId: loginPassword
      summary: Sign in with a profile name or e-mail and a password
      description: |
        Only a profile that has set a password can sign in this way. The identifier is the
        account's verified e-mail (ISO-1397/ISO-1596; confirmed or not — the password is proof
        enough on its own) or, for a profile from before e-mail was required, its display name.
        Compared trimmed, NFKC-normalised and case-insensitively. Send it as `identifier`
        (what the app sends), `name` (the original field, still accepted) or `email`. In
        `identifier` and `name`, a value with an `@` is looked up as an e-mail first and
        then as a name; `email` is looked up only as an e-mail.
        A wrong password, an unknown identifier and an identifier whose profile has no password
        all get the same `401` after the same scrypt work, so neither the answer nor its timing
        says which accounts exist. So does a password that was right when its check started but
        was changed, reset or removed before the check finished. Five wrong passwords for an
        account pause it, whichever identifier they named it by (see *Throttling*); passkey
        sign-in is never paused by this. Sets the
        same session cookie as `/api/login/verify`. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: One of `identifier`, `name` or `email`, and the password.
              properties:
                identifier: { type: string, description: A profile name or an e-mail address. }
                name: { type: string, description: 'The original field: a profile name, or an e-mail address.' }
                email: { type: string, description: An e-mail address only. }
                password: { type: string, maxLength: 256 }
            examples:
              byName: { value: { identifier: "Ada", password: "correct horse battery staple" } }
              byEmail: { value: { identifier: "ada@example.com", password: "correct horse battery staple" } }
              legacy: { value: { name: "Ada", password: "correct horse battery staple" } }
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Identifier or password missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "name and password required", code: "missing" }
        '401':
          description: Wrong e-mail/name or password — deliberately one answer for every cause.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "wrong e-mail or password", code: "bad-credentials" }
        '403':
          description: The right password for a disabled account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/register/password:
    post:
      tags: [password]
      operationId: registerPassword
      summary: Create a profile with a name and password
      description: |
        For browsers that cannot make a passkey (plain http on a LAN address, some Firefox
        setups). Creates the profile and signs it in. The same invite rules as passkey
        registration apply: on an invite-only instance the code is checked first, checked
        again after hashing, and burned. The password must be 10–256 characters and not one
        of the passwords guessing scripts try first; no two profiles with a password may
        share a name. `email` is required (ISO-1596 — the same verified address passkey
        signup has required since ISO-1397); one that is not an address is refused with `400
        email-invalid`, one that is in use with `409 email-taken` — asked only after the
        invite check, so without a valid code neither is ever answered — which counts against
        the caller's address like a wrong invite code. A confirmation link is mailed right
        after signup, exactly like passkey registration (`POST /api/register/verify`); an
        unconfirmed address signs in fine, it just leaves `needsEmail`/`emailVerified` on
        `GET /api/me` saying so. `termsVersion`
        follows the same rule as in `POST /api/register/options` (`400 terms-required` /
        `400 terms-version-stale`, checked right after the name) and is recorded on the
        account (ISO-1390). `birthDate` is required (ISO-1521), checked right after
        `termsVersion`, before the invite code: missing is `400 birth-date-required`, not a date
        is `400 birth-date-invalid`, under 18 as of now is `400 underage` — the same three codes
        and the same place in the flow as `POST /api/register/options`. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, birthDate, termsVersion]
              properties:
                name: { type: string, maxLength: 40 }
                termsVersion: { type: string, description: Required. The Terms/Privacy version accepted; must be the one in force. }
                birthDate: { type: string, description: 'Required, `YYYY-MM-DD`. Not in the future, not implausibly old, and 18+ as of now.' }
                password: { type: string, minLength: 10, maxLength: 256 }
                code: { type: string, description: Invite code (INVITE_ONLY only). }
                email: { type: string, maxLength: 254, description: 'Required. The account''s verified e-mail — a confirmation link is mailed right after signup.' }
            example: { name: "Ada", email: "ada@example.com", password: "correct horse battery staple", birthDate: "1990-05-05", termsVersion: "2026-10-18", code: "3F9C21A07B54D688" }
      responses:
        '200':
          description: Registered and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            The password breaks the policy — `too-short` (under 10 characters), `too-long`
            (over 256) or `too-common` — a field is `missing`, `email-invalid`: the
            `email` given is not an e-mail address, `terms-required`: no `termsVersion`,
            `terms-version-stale`: not the version in force, `birth-date-required`: no
            `birthDate`, `birth-date-invalid`: not a date, or `underage`: under 18 as of now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                policy: { value: { error: "this password is too easy to guess", code: "too-common" } }
                email: { value: { error: "that is not an e-mail address", code: "email-invalid" } }
                termsRequired: { value: { error: "update the app to accept the terms", code: "terms-required" } }
                termsStale: { value: { error: "these terms are not the current ones — update the app", code: "terms-version-stale" } }
                birthDateRequired: { value: { error: "a birth date is required", code: "birth-date-required" } }
                birthDate: { value: { error: "that is not a date", code: "birth-date-invalid" } }
                underage: { value: { error: "Brilhart Fitness is for people 18 and older", code: "underage" } }
        '403':
          description: Invite-only and the code is missing, used or revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required", code: "invite" }
        '409':
          description: >-
            `name-taken` (see NameTaken) or `email-taken` — the e-mail is in use by another
            profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already uses this e-mail address", code: "email-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/login/password-reset:
    post:
      tags: [password]
      operationId: redeemPasswordReset
      summary: Set a new password with an admin's one-time reset code
      description: |
        Redeems the code from `POST /api/admin/user/password-reset` (valid 24 h, single
        use, stored only as a hash; dashes, spaces and case do not matter) and signs in.
        A new password that breaks the policy is refused without using up the code. Every
        other session of the account ends. Wrong codes count against the caller's address
        only (see *Throttling*), never against the name, so they cannot keep a real code
        from working. The profile is named by its name or its sign-in e-mail, in
        `identifier`, `name` or `email` as at sign-in. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, next]
              properties:
                identifier: { type: string, description: The profile name or its sign-in e-mail. }
                name: { type: string, description: The original field; an e-mail works here too. }
                email: { type: string }
                code: { type: string, example: "K7WQ-2MZP-4HXA" }
                next: { type: string, minLength: 10, maxLength: 256 }
      responses:
        '200':
          description: Password set and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            `reset-invalid` (wrong, used or expired code — one answer for all),
            `missing`, or a password-policy code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that reset code is wrong or has expired", code: "reset-invalid" }
        '403':
          description: The account has been disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '409': { $ref: '#/components/responses/NameTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account:
    delete:
      tags: [auth]
      operationId: deleteAccount
      summary: Delete this account, and everything of theirs
      description: |
        Self-service (ISO-1447): the same deletion `POST /api/admin/user/delete` does, for your
        own account — the row itself and everything that cascades from it (training data,
        passkeys, push subscriptions, device links, sessions, e-mail tokens, subscriptions), an
        active Stripe subscription (cancelled immediately, never at period end) and the Stripe
        customer itself, the Coach's per-profile file and any credential stored for it, and
        uploaded photos and videos. `invites.used_by` stays burned, same as it always has.

        A session alone is not proof enough — see `OwnerProof` — so a stolen cookie cannot delete
        the account out from under its owner: `cid`+`credential` (a passkey assertion made for
        this request, `cid` from `POST /api/login/options`) or `current` (the account's password,
        only while `PASSWORD_LOGIN` is on). The last admin standing cannot delete themselves —
        promote someone else first. Not reversible. Audited as `account.delete`, by id alone —
        never the name or e-mail. The response clears the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: The account and everything of theirs is gone.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: The caller is the last admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "you are the last admin — make someone else admin first", code: "last-admin" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/password:
    get:
      tags: [password]
      operationId: getAccountPassword
      summary: Whether this profile has a password
      responses:
        '200':
          description: The profile's password state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: boolean }
                  setAt: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
                  passkeys: { type: integer, description: 'How many passkeys the profile has; 0 means the password cannot be removed.' }
                  name: { type: string, description: The name to sign in with. }
                  nameTaken:
                    type: boolean
                    description: Another profile already signs in with this name, so no password can be set here.
                  email:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: The e-mail this profile may sign in with (POST /api/account/email), or null.
              example: { set: true, setAt: "2026-09-23T10:00:00.000Z", passkeys: 1, name: "Ada", nameTaken: false, email: "ada@example.com" }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [password]
      operationId: setAccountPassword
      summary: Set or change this profile's password
      description: |
        Proof first: `current` when the profile has a password, or a passkey assertion made
        for this request (`cid` from `POST /api/login/options`, `credential` signed by one of
        *this* profile's passkeys) — the only way to set a first password, and the way to
        replace a forgotten one. A session alone is never enough. Wrong `current` values
        count toward the same pause as wrong sign-ins. On success the session version is
        bumped, which ends every other session and pending pairing code of the account; the
        caller's own continues on a fresh cookie, or a fresh `token` for a Bearer caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                next: { type: string, minLength: 10, maxLength: 256 }
                current: { type: string }
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnAuthenticationCredential' }
      responses:
        '200':
          description: Saved. Other sessions have ended.
          headers:
            Set-Cookie:
              description: A fresh session cookie for this browser (cookie callers).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  token: { type: string, description: 'Bearer callers only — the token to use from now on.' }
        '400': { $ref: '#/components/responses/PasswordPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            No acceptable proof: `current-required`, `current-wrong`, `passkey-required`
            (no password yet, so a passkey has to confirm), or `passkey` (the assertion did
            not verify or belongs to another profile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "your current password is not right", code: "current-wrong" }
        '409': { $ref: '#/components/responses/NameTaken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }
    delete:
      tags: [password]
      operationId: removeAccountPassword
      summary: Remove this profile's password
      description: >-
        Refused while the profile has no passkey: the password would be its last way in.
        Otherwise the body carries the same proof setting one takes — `current`, the
        password itself, or a passkey assertion made for this request (`cid` from
        `POST /api/login/options`, `credential` signed by one of *this* profile's
        passkeys). A session alone is never enough: a stolen cookie must not take away
        the owner's way in where passkeys do not work. The last-way-in refusal comes before
        the proof is checked, and is checked again after it. Wrong `current` values count
        toward the same pause as wrong sign-ins. Existing sessions are left alone
        (`POST /api/logout/all` ends them). A profile without a password gets 200 as well,
        with no proof asked. Audited as `auth.password.remove`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed (or there was none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: The password is the profile's only way in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the password is the only way into this profile", code: "last-way-in" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/email:
    post:
      tags: [email]
      operationId: setAccountEmail
      summary: Set or change the account's one verified e-mail
      description: |
        Sets or changes the account's e-mail (ISO-1397; ISO-1596 made this the only handler for
        this route, `PASSWORD_LOGIN` on or off — see "e-mail sign-in" in SELF_HOSTING.md for why
        there used to be two). Stored trimmed, NFKC-normalised and lower-cased; at most 254
        characters; unique across every profile, and never another password-holding profile's
        name. Changing it clears `email_verified_at` and mails a fresh confirmation link (24h),
        same as a first-time address.

        The body carries the same proof as setting a password (see OwnerProof): a session
        alone is never enough. Saving the address the profile already has answers 200 with
        no proof asked. An address in use by another profile is refused only after the
        proof, with `409 email-taken`. It says an address is in use somewhere on this
        instance, never by whom. Audited as `auth.email.set` / `auth.email.change` with the
        address masked (`a…@e…`).

        There is no removal — an account's e-mail is mandatory for a new signup (passkey or
        password) and is this instance's one way back in once every passkey is lost
        (`POST /api/recover/request`/`redeem`); `DELETE /api/account/email` is a plain 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OwnerProof'
                - type: object
                  required: [email]
                  properties:
                    email: { type: string, maxLength: 254 }
            example: { email: "ada@example.com", current: "correct horse battery staple" }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  email: { type: string, description: The address as stored. }
              example: { ok: true, email: "ada@example.com" }
        '400':
          description: Not an e-mail address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that is not an e-mail address", code: "email-invalid" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: Another profile already uses this address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already uses this e-mail address", code: "email-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/email/verify:
    post:
      tags: [email]
      operationId: verifyAccountEmail
      summary: Confirm an e-mail address with the link's token
      description: |
        No session required — the link opens in whatever browser/device the mail client is
        on. The token is single-use and expires 24h after it was minted (at signup, at
        `POST /api/account/email`, or by `POST /api/account/email/resend`). A wrong or
        replayed token pauses the caller's address (tag `email` throttle, shared with
        `resend`: 20 free, then 30 s doubling to 15 min). Sets `email_verified_at`.
        CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Token missing, wrong, already used, or expired — one answer for all of them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that link is invalid or expired", code: "token-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/account/email/resend:
    post:
      tags: [email]
      operationId: resendAccountEmailVerification
      summary: Mint and mail a fresh confirmation link
      description: |
        For the signed-in owner, when the first link expired or never arrived. Invalidates
        whichever confirmation token was still live. A no-op (200) if there is no e-mail yet
        or it is already confirmed. Shares the `email` throttle's address pause with
        `POST /api/account/email/verify`.
      responses:
        '200':
          description: 'A new link was sent, or there was nothing to send.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  alreadyVerified: { type: boolean }
        '400':
          description: This profile has no e-mail yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this profile has no e-mail yet", code: "no-email" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/account/terms/accept:
    post:
      tags: [auth]
      operationId: acceptTerms
      summary: Accept the current Terms of Use and Privacy Policy
      description: |
        For a signed-in account whose `GET /api/me` says `needsTerms: true` — one imported from
        before acceptance was recorded, or one that accepted an older text (ISO-1390). `version`
        must be the server's current `legal_version` (see `GET /api/config`): missing is
        `terms-required`, any other value is `terms-version-stale` (the app shows an outdated
        text and needs an update). Idempotent: when the account already accepted this version,
        answers 200 with the stored acceptance and records nothing new.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: 'The LEGAL_VERSION of the text the app showed.' }
            example: { version: "2026-10-18" }
      responses:
        '200':
          description: The account has accepted the current version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  termsVersion: { type: string }
                  termsAcceptedAt: { type: string, format: date-time }
              example: { ok: true, termsVersion: "2026-10-18", termsAcceptedAt: "2026-10-18T12:00:00.000Z" }
        '400':
          description: '`version` is missing (`terms-required`) or not the current one (`terms-version-stale`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                required: { value: { error: "update the app to accept the terms", code: "terms-required" } }
                stale: { value: { error: "these terms are not the current ones — update the app", code: "terms-version-stale" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/recover/request:
    post:
      tags: [email]
      operationId: recoverRequest
      summary: '"I lost my access": request a recovery link'
      description: |
        Always `200 {"ok":true}` — the same body whether or not `email` names a real,
        enabled account, so the response never reveals which addresses have one. When it
        does, a one-time, 15-minute link is mailed; a guess at an address with no account
        still quietly counts toward a per-address pause (20 free, then 30 s doubling to
        15 min) — the pause only ever slows further guessing, and is never itself the
        answer (unlike every other throttled route here, this one never answers 429).
        CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
            example: { email: "ada@example.com" }
      responses:
        '200':
          description: Always — see above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/recover/redeem:
    post:
      tags: [email, password]
      operationId: recoverRedeem
      summary: Burn a recovery token for a device-link code, or (ISO-1596) a new password
      description: |
        Single-use either way. With no `password` (or `PASSWORD_LOGIN` off), returns the same
        `{code, expires}` shape as `POST /api/account/device-link` — the client finishes with
        the existing device-link pair (`POST /api/device-link/options` → `POST
        /api/device-link/verify`, tag `passkeys`) to create a fresh passkey on this device and
        sign in. Old passkeys are untouched; their owner removes them in Settings if they want
        to.

        With `PASSWORD_LOGIN` on and a `password` in the body (ISO-1596), the token sets that
        password directly instead and signs the account in — the same session shape as
        `POST /api/login/password`. The password policy (same as `POST /api/account/password`)
        is checked *before* the token is consumed, so a password this instance refuses never
        burns an otherwise-good link. Ends every other session of the account, the same as any
        other password change. Audited as `auth.recover.password`.

        A wrong or replayed token pauses the caller's address, shared with
        `POST /api/device-link/*` (20 free, then 30 s doubling to 15 min). CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10, maxLength: 256, description: 'PASSWORD_LOGIN only. Sets a new password instead of returning a device-link code.' }
            examples:
              deviceLink: { value: { token: "a1b2c3…" } }
              newPassword: { value: { token: "a1b2c3…", password: "correct horse battery staple" } }
      responses:
        '200':
          description: A fresh device-link code, or (with `password`) a signed-in session.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      code: { type: string }
                      expires: { type: number, description: Expiry (ms). }
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/SessionUser' }
              examples:
                deviceLink: { value: { code: "K7WQ2MZP", expires: 1769300000000 } }
                newPassword: { value: { user: { id: "u_123", name: "Ada", admin: false } } }
        '400':
          description: >-
            Token missing, wrong, already used, expired, or its account is gone/disabled — or
            (with `password`) the password breaks the policy (same codes as
            `POST /api/account/password`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that link is invalid or expired", code: "token-invalid" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/admin/user/password-reset:
    post:
      tags: [admin, password]
      operationId: adminPasswordReset
      summary: 'Admin: issue a one-time password reset code'
      description: |
        Returns a code (12 characters from the pairing alphabet, 60 bits) that is shown
        once, stored only as a SHA-256, valid for 24 h and good for one
        `POST /api/login/password-reset`. Issuing it removes the profile's current password
        and bumps its session version (every session and pending pairing code ends);
        passkeys keep working. A newer code replaces an older one. Admin accounts are
        refused — an admin sets their own password in Settings. Audited as
        `admin.password.reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The user id. }
      responses:
        '200':
          description: The code, once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  name: { type: string, description: The name to redeem it with. }
                  code: { type: string }
                  expires: { type: number, description: Expiry (ms). }
              example: { ok: true, name: "Ada", code: "K7WQ-2MZP-4HXA", expires: 1790000000000 }
        '400':
          description: The target is an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "an admin sets their own password in Settings" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }
        '409': { $ref: '#/components/responses/NameTaken' }

  /api/account/passkeys:
    get:
      tags: [passkeys]
      operationId: listPasskeys
      summary: This profile's passkeys
      description: >-
        Every passkey that signs this profile in, without key material. `created` and
        `lastUsed` are null for a passkey made before they were recorded.
      responses:
        '200':
          description: The list, and what it allows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [passkeys]
      operationId: removePasskey
      summary: Remove one passkey
      description: |
        Refused while it is the profile's last way in: its only passkey, and no password
        that can sign in (a password counts only while `PASSWORD_LOGIN` is on). Otherwise
        the body carries the same proof adding one takes (`OwnerProof`): a session alone is
        never enough, since a stolen cookie could otherwise choose which of the owner's
        passkeys is left. Any of the profile's passkeys may confirm, the one being removed
        included. The 404 and 409 refusals come before the proof is checked, and the
        last-way-in rule is checked again after it. Audited as `auth.passkey.remove`. An
        unused device code of the profile is dropped too, so one made with the removed
        passkey cannot add another afterwards.

        Sessions are not tied to the passkey that opened them, so a session it already
        opened carries on; `POST /api/logout/all` ends those.
      parameters:
        - name: id
          in: query
          required: true
          description: The passkey's `id` from the list (its WebAuthn credential id).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '404':
          description: No passkey of this profile has that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "passkey not found", code: "not-found" }
        '409':
          description: It is the profile's last way in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this passkey is the only way into this profile", code: "last-way-in" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/passkeys/options:
    post:
      tags: [passkeys]
      operationId: addPasskeyOptions
      summary: 'Add a passkey (step 1): prove it is you, get creation options'
      description: |
        A session alone is never enough to add a way in that outlives "sign out
        everywhere". The body carries the same proof `POST /api/account/password` takes:
        a passkey assertion made for this request (`cid` from `POST /api/login/options`,
        `credential` signed by one of *this* profile's passkeys), or `current`, the
        profile's password — only while `PASSWORD_LOGIN` is on. With it off, a password
        kept from before is not checked at all and the answer is `passkey-required`, so a
        password-only profile has to move onto a passkey while the flag is still on. Wrong
        passwords count toward the sign-in pause.

        The options use the profile's own user handle and list its passkeys in
        `excludeCredentials`, so an authenticator that already holds one refuses. The
        challenge is good for 5 minutes, for this profile, and only while the session
        version is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string, description: 'One-shot challenge id for /api/account/passkeys/verify.' }
                  options: { $ref: '#/components/schemas/WebAuthnRegistrationOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/account/passkeys/verify:
    post:
      tags: [passkeys]
      operationId: addPasskeyVerify
      summary: 'Add a passkey (step 2): store the new one'
      description: >-
        Verifies the attestation against the challenge from step 1 and stores the passkey
        on this profile. Audited as `auth.passkey.add`, with the proof that allowed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnRegistrationCredential' }
                name: { type: string, maxLength: 40, description: 'A label of the owner''s choosing ("Work laptop").' }
      responses:
        '200':
          description: Added. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '400':
          description: Challenge expired, replayed or made for another profile, or the attestation did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "challenge expired — try again" }
        '401':
          description: >-
            Not signed in — including a session that was ended ("sign out everywhere", a
            new password) after step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "not signed in" }
        '409':
          description: '`credential-exists` (that passkey is already registered) or `passkey-limit`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered", code: "credential-exists" }

  /api/account/passkeys/rename:
    post:
      tags: [passkeys]
      operationId: renamePasskey
      summary: Name one passkey
      description: An empty name clears it; the app then shows a numbered "Passkey n".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                name: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Renamed. The list as it is now.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasskeyList'
                  - type: object
                    properties:
                      ok: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No passkey of this profile has that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "passkey not found", code: "not-found" }

  /api/account/device-link:
    post:
      tags: [passkeys]
      operationId: createDeviceLink
      summary: Make a one-time device link
      description: |
        For adding another device of the same person: returns a code of 12 characters from
        the pairing alphabet (60 bits), which the app also shows as a QR code of
        `<app>?link=<code>`. The other device redeems it with `/api/device-link/*` by
        creating a passkey of its own. The code is shown once, stored only as a SHA-256,
        good for 10 minutes and for one passkey; a newer one replaces it, and signing out
        everywhere, a new password, an admin reset or a disable drop it. Same proof as
        adding a passkey. Audited as `auth.link.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: The code, once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expires: { type: number, description: Expiry (ms). }
              example: { code: "K7WQ-2MZP-4HXA", expires: 1790000000000 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Busy' }

  /api/device-link/options:
    post:
      tags: [passkeys]
      operationId: deviceLinkOptions
      summary: 'Redeem a device link (step 1): check the code, get creation options'
      description: |
        Called on the other device, which has no session: the code is the credential.
        Returns creation options for the profile the code belongs to, and that profile's
        id and name. Does not use the code up, so a dismissed passkey prompt can be tried again.
        Wrong codes count toward a per-address pause of link redemption (see
        *Throttling*). **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'Case, spaces and dashes are ignored.' }
            example: { code: "K7WQ-2MZP-4HXA" }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  options: { $ref: '#/components/schemas/WebAuthnRegistrationOptions' }
                  id: { type: string, description: "The profile's id (also the options' user handle). Names are not unique; this is what tells two profiles apart." }
                  name: { type: string, description: The profile this device is being added to. }
        '400': { $ref: '#/components/responses/LinkInvalid' }
        '409': { $ref: '#/components/responses/PasskeyLimit' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/device-link/verify:
    post:
      tags: [passkeys]
      operationId: deviceLinkVerify
      summary: 'Redeem a device link (step 2): store the passkey and sign this device in'
      description: |
        Verifies the attestation against the challenge from step 1 (which must have been
        made for this very code), stores the passkey on the code's profile, burns the code
        and sets the session cookie — the passkey just made is what signs the device in.
        Of two requests racing with one code, one wins. Audited as `auth.link.ok`, and every
        refusal as `auth.link.fail`. **Not** CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, cid, credential]
              properties:
                code: { type: string }
                cid: { type: string }
                credential: { $ref: '#/components/schemas/WebAuthnRegistrationCredential' }
                name: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Added and signed in.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            `link-invalid` (see below), a challenge that expired or was made for another
            code, or an attestation that did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that code is wrong, used or expired", code: "link-invalid" }
        '409':
          description: '`credential-exists` or `passkey-limit`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered", code: "credential-exists" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/google/start:
    get:
      tags: [google]
      operationId: googleAuthStart
      summary: Begin a Google OAuth round trip (login, signup or reauth)
      description: |
        302s to Google's own authorization endpoint (discovered from
        `https://accounts.google.com/.well-known/openid-configuration`), with a fresh PKCE
        pair, `state` and `nonce`. Sets a signed, HttpOnly `gauth_oauth` cookie (path
        `/api/auth/google`, 10 minutes) carrying all three plus `intent` and, for `reauth`,
        the session's own user id — `GET /api/auth/google/callback` checks the request
        against it.

        `intent=login` and `intent=signup` need no session and behave identically — only
        which screen the person started from differs, and the result always routes back to
        `#/entrar`. `intent=reauth` needs a session **and** an existing linked Google
        identity (400 `not-linked` otherwise); it is proveOwner's third proof (tag `google`,
        `OwnerProof.googleProof`), for a profile with neither a password nor a passkey.

        `intent=link` is **not** handled here — see `POST /api/account/google/start`, which
        asks for proof before it ever redirects, something a bare GET cannot carry.
      security: []
      parameters:
        - name: intent
          in: query
          required: true
          schema: { type: string, enum: [login, signup, reauth] }
      responses:
        '302':
          description: Redirect to Google's authorization endpoint.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: The signed gauth_oauth state cookie. }
        '400':
          description: '`invalid intent`, or (reauth) `not-linked`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no Google account linked yet", code: "not-linked" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Google's discovery document could not be fetched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "google is unavailable right now" }

  /api/account/google/start:
    post:
      tags: [google]
      operationId: googleLinkStart
      summary: Prove ownership, then begin the Google round trip to link this profile
      description: |
        The proof `POST /api/account/passkeys/options` asks before adding a passkey — a
        passkey assertion (`cid` + `credential`) or the current password — asked here
        instead of at a bare GET, which could not carry either. On success, returns the
        same authorization URL `GET /api/auth/google/start` would redirect to and sets the
        same signed `gauth_oauth` cookie (`intent` fixed to `link`); the client navigates
        the whole page to it itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: The URL to navigate to.
          headers:
            Set-Cookie:
              description: The signed gauth_oauth state cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: This profile already has a linked Google identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this profile is already linked to a Google account", code: "already-linked" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Google's discovery document could not be fetched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "google is unavailable right now" }

  /api/auth/google/callback:
    get:
      tags: [google]
      operationId: googleAuthCallback
      summary: Google's redirect back — verify the ID token and act on the result
      description: |
        Checks the `gauth_oauth` cookie and `state` (constant-time), exchanges `code` at
        Google's token endpoint (with the PKCE verifier), and verifies the ID token itself:
        RS256 signature against Google's own published JWKS (cached per
        `Cache-Control: max-age`; an unknown `kid` gets one refetch), `iss`, `aud`/`azp`,
        `exp`/`iat` within 5 minutes, the `nonce` from the cookie, and
        `email_verified === true`. Always a 302 back into the app — never a JSON error —
        carrying a result code in `google` after the hash (`#/entrar?google=ok` for
        login/signup, `#/configuracoes?google=linked` for link/reauth):

        | `google` | Meaning |
        |---|---|
        | `ok` | Existing account, already linked — signed in. |
        | `linked` | Login/signup: a verified e-mail matched an unlinked account, now linked and signed in. Link: a new link was created. |
        | `email-unverified` | Login/signup: the e-mail matches an account whose e-mail is not yet confirmed — refused, not linked (ISO-1397 anti-hijack rule). |
        | `signup` | No account matches at all — a pending-signup ticket (`gauth_signup` cookie) was set; carries `name`/`email` to prefill. Finish with `POST /api/register/google`. |
        | `disabled` | The matching account is disabled. |
        | `already-linked` | Link only: this Google account is already linked to a *different* profile. |
        | `cancelled` | Google returned `error=access_denied` — a real decline, not a failure; never audited or throttled as one. |
        | `reauth-ok` | Reauth only: the linked identity matched; carries `proof`, for `OwnerProof.googleProof`. |
        | `reauth-mismatch` | Reauth only: a different Google account confirmed than the one linked to this profile. |
        | `error` | Anything else — a forged/expired state cookie, a token-exchange failure, an ID token that failed any check. |

        Every path clears `gauth_oauth`; a successful `ok`/`linked` for login/signup also
        sets the session cookie, same shape as `POST /api/login/verify`. Rate-limited (tag
        `google`'s own throttle kind): a wrong `state`, a failed token exchange, or a failed
        ID-token check each strike the caller's address.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - name: error
          in: query
          schema: { type: string }
          description: Set by Google itself, e.g. `access_denied`.
      responses:
        '302':
          description: Always — back into the app, result in the `google` query parameter after the hash.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie:
              schema: { type: string }
              description: Clears gauth_oauth; sets the session cookie or gauth_signup on success.

  /api/register/google:
    post:
      tags: [google]
      operationId: registerGoogle
      summary: Finish a Google signup (no existing account matched)
      description: |
        Reads the `gauth_signup` cookie `GET /api/auth/google/callback` set (15 minutes,
        single-use — the `(provider, subject)` unique index that backs every Google link is
        what actually enforces that, same as every other one-time claim in this API).
        Google already proved the e-mail, so this never mails a confirmation —
        `email_verified_at` is set the moment the row is. Same Terms-acceptance and
        under-18 rules as `POST /api/register/password` (checked in the same order, before
        any address- or invite-guess budget is spent), the same `INVITE_ONLY` gate, and the
        same single transaction (the account, the invite and the Google identity commit or
        fail together). **Not** CSRF-exempt — see *CSRF* above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [birthDate, termsVersion]
              properties:
                birthDate: { type: string, format: date }
                termsVersion: { type: string }
                name: { type: string, maxLength: 40, description: "Defaults to the Google account's own name, then the e-mail's local part." }
                code: { type: string, description: Invite code — required when INVITE_ONLY=1. }
            example: { birthDate: "2000-01-01", termsVersion: "2026-10-18", name: "Ada" }
      responses:
        '200':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              description: Session cookie; clears gauth_signup.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            `ticket-invalid` (no/expired gauth_signup cookie), `missing` (no name could be
            derived), `terms-required`, `terms-version-stale`, `birth-date-required`,
            `birth-date-invalid`, or `underage`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "that Google sign-up has expired — start again", code: "ticket-invalid" }
        '403':
          description: '`invite` — missing or no-longer-valid invite code (INVITE_ONLY=1 only).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required", code: "invite" }
        '409':
          description: >-
            `name-taken`, `email-taken`, or `already-linked` (this Google account was
            linked elsewhere in the gap since the ticket was issued).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another profile already signs in with this name", code: "name-taken" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/account/google:
    delete:
      tags: [google]
      operationId: unlinkAccountGoogle
      summary: Remove this profile's linked Google identity
      description: >-
        Never the last way in: refused while it is the only one (no passkey, no password
        that counts). Otherwise the same proof adding a passkey asks (`OwnerProof` —
        including, for a Google-only profile, `googleProof`). A profile with no Google
        identity gets 200 as well, with no proof asked. Audited as `auth.google.unlink`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerProof' }
      responses:
        '200':
          description: Removed (or there was none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProofRefused' }
        '409':
          description: Connecting with Google is the profile's only way in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "connecting with Google is the only way into this profile", code: "last-way-in" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/data:
    get:
      tags: [data]
      operationId: getData
      summary: Pull the account's app state
      description: >-
        Returns the caller's entire app state as one JSON blob, or `{"state": null}`
        if nothing has been synced yet, together with `rev`, the server's revision of
        that document (0 when there is none). A client keeps the `rev` it last read or
        wrote and sends it back as `baseRev` on the next push, which lets the server
        refuse a write over a document the client never saw (see the 409 on PUT).
      responses:
        '200':
          description: The stored state, or null, and its revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
                  rev:
                    type: integer
                    description: Server revision of the stored document; 0 when there is none.
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [data]
      operationId: putData
      summary: Push the account's app state
      description: |
        Replaces the stored state wholesale (atomic write; there is no merge on the
        server). The `active` field — an in-progress workout — is stripped before
        saving: a running session belongs to the device running it. Body limit 5 MiB.

        With `baseRev` the write is conditional: it goes through only when `baseRev`
        equals the document's current revision, and answers 409 with the current
        document otherwise — the client merges the two and pushes again with the
        revision it was given. Without `baseRev` the write is unconditional (clients
        from before revisions, and deliberate replaces such as a backup import). The
        server stamps the new revision into the document as `_rev`; a `_rev` sent by
        the client is ignored.

        Every accepted write also starts the grace period of each stored file (tag `media`)
        the new state no longer references, and stops it for each one it references again.
        That bookkeeping never changes the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/State' }
                baseRev:
                  oneOf: [{ type: integer }, { type: 'null' }]
                  description: >-
                    The revision this client last read or wrote. Omit or null for an
                    unconditional overwrite.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  ts:
                    oneOf: [{ type: number }, { type: 'null' }]
                    description: Echo of the pushed state's `_ts`, if present.
                  rev:
                    type: integer
                    description: The revision the write produced.
        '409':
          description: >-
            `baseRev` is not the current revision — another client wrote since this one
            last read. Carries the current document so the client can merge and retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: conflict }
                  rev: { type: integer }
                  state:
                    oneOf:
                      - $ref: '#/components/schemas/State'
                      - type: 'null'
        '400':
          description: >-
            `state` missing or not an object, `state` an array or an object with nothing of
            the profile in it (`_rev`/`_ts` do not count — both would empty the profile), or
            `workouts`/`routines` set to anything other than an array or null. Entries inside
            those two arrays that are not objects (`null`, numbers, nested arrays) are dropped
            before the write rather than refused, so a client with a damaged copy still syncs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missing: { value: { error: "state required" } }
                invalid: { value: { error: "invalid state" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/SubscriptionRequired' }

  /api/data/rev:
    get:
      tags: [data]
      summary: Current revision of the caller's profile state
      description: |
        The `rev` that `GET /api/data` would return, without the document. Signed-in clients poll
        this while open and on every return to the foreground and fetch the document only when
        the number changed.
      responses:
        '200':
          description: The current revision (0 when the profile has no state yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/billing/status:
    get:
      tags: [billing]
      operationId: getBillingStatus
      summary: The caller's subscription, for the plan screen and the read-only banner
      description: |
        `enabled: false` when the instance has no `STRIPE_API_KEY`/`STRIPE_WEBHOOK_SECRET` — the
        only way this route ever answers without a `status`, so a client can tell "no billing on
        this instance" apart from "no subscription yet" (`status: "none"`) without a 404.

        There is no `trialing`: per ISO-1392's status-mapping table, the R$1,99 first month is a
        sub-state of `active`, surfaced as `firstPeriod: true` rather than a different `status` —
        a first-ever Checkout sells one cycle of the intro Price directly (no Stripe trial), so the
        subscription is `active` from its first invoice. `active` is what the app shows the
        read-only banner on: true for `status` `active` or `past_due` (Stripe still retrying a
        failed renewal — issue rule, never an immediate block); false otherwise, including a
        `canceled` subscription past its `currentPeriodEnd`. `nextChargeAmount`/`nextChargeDate`
        describe the upcoming invoice — the full plan price even while `firstPeriod` is still true.
        `firstFullCharge` is set once `invoice.paid` reports the first post-intro invoice, and
        never changes after that.
      responses:
        '200':
          description: Current billing state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  status: { type: string, enum: [none, active, past_due, canceled, incomplete, incomplete_expired, unpaid] }
                  active: { type: boolean }
                  plan: { oneOf: [{ type: string, enum: [monthly, quarterly, yearly] }, { type: 'null' }] }
                  firstPeriod: { type: boolean, description: Still on the R$1,99 first cycle. }
                  since: { oneOf: [{ type: string, format: date-time }, { type: 'null' }], description: When this subscription was created. }
                  nextChargeDate: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
                  nextChargeAmount: { oneOf: [{ type: integer, description: Centavos. }, { type: 'null' }] }
                  cancelAtPeriodEnd: { type: boolean }
                  firstFullCharge:
                    oneOf:
                      - type: object
                        properties:
                          at: { type: string, format: date-time }
                          amount: { type: integer, description: Centavos. }
                          currency: { type: string }
                      - type: 'null'
              example: { enabled: true, status: "active", active: true, plan: "monthly", firstPeriod: true, nextChargeDate: "2026-10-31T00:00:00.000Z", nextChargeAmount: 8900, cancelAtPeriodEnd: false, firstFullCharge: null }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/billing/checkout:
    post:
      tags: [billing]
      operationId: createBillingCheckout
      summary: Start a Stripe Checkout Session for one of the three plans
      description: |
        Requires the current terms accepted (ISO-1390) — refused with 403 `terms-required`
        otherwise, checked first, so when both are missing the client shows the terms before the
        e-mail. Then requires a verified e-mail (Phase 2) — refused with 403 `email-unverified`
        otherwise, since the renewal and first-period notices this phase sends have nowhere to go
        without one. Creates the account's Stripe customer on first use.

        There is no free trial and no Stripe `trialing` status (ISO-1392): an account's first-ever
        Checkout Session sells one cycle of `STRIPE_PRICE_INTRO` alone (R$1,99), so the subscription
        is `active` from its first invoice; the webhook then converts it into a Subscription
        Schedule that moves to the chosen plan's own Price after that one cycle.
        `GET /api/billing/status`'s `firstPeriod` is how a client tells the two apart, since `status`
        itself never changes between them. An account that already had a subscription before
        (cancelled or otherwise) does not get the intro price again — Checkout sells the chosen
        plan's Price directly, full price from the start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [monthly, quarterly, yearly] }
            example: { plan: "monthly" }
      responses:
        '200':
          description: The Checkout Session's hosted URL — redirect the browser to it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        '400':
          description: '`plan` is missing or not one of the three known plans.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid plan", code: "invalid-plan" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The account has not accepted the current terms (`terms-required`, checked first —
            accept them with `POST /api/account/terms/accept`), or its e-mail is not verified yet
            (`email-unverified`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                termsRequired: { value: { error: "accept the current terms first", code: "terms-required" } }
                emailUnverified: { value: { error: "e-mail not verified", code: "email-unverified" } }
        '404': { $ref: '#/components/responses/BillingOff' }

  /api/billing/portal:
    post:
      tags: [billing]
      operationId: createBillingPortal
      summary: Open the Stripe Customer Portal (card, plan, cancellation, invoices)
      description: |
        Cancelling in the Portal is always `cancel_at_period_end` with no proration: access
        continues until `currentPeriodEnd` and the account only goes read-only once that date is
        reached and `customer.subscription.deleted` lands.
      responses:
        '200':
          description: The Portal session's hosted URL — redirect the browser to it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        '400':
          description: The account has no Stripe customer yet (it has never started a checkout).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no stripe customer", code: "no-customer" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/BillingOff' }

  /api/billing/webhook:
    post:
      tags: [billing]
      operationId: billingWebhook
      summary: Stripe webhook — subscription and invoice lifecycle
      description: |
        No session and no CSRF check (Stripe's server-to-server POST carries neither a cookie nor
        an `Origin` header); the `Stripe-Signature` header, verified against the raw request body
        with `STRIPE_WEBHOOK_SECRET`, is this route's only authentication. Idempotent by
        `event.id`: a redelivered event (a Stripe retry, or the exact same event forwarded twice by
        `stripe listen`) is acknowledged without being applied a second time (`duplicate: true`).
        The claim and the apply are two separate steps, though: if applying an event's effect throws
        — the Subscription Schedule conversion below is the one point that calls out to Stripe
        itself, and the one thing here that can fail for a reason that has nothing to do with our
        own data — the claim is undone before the 500 that tells Stripe to retry, so the same
        `event.id` gets a genuine second attempt rather than reading back as already handled.

        Handled event types: `checkout.session.completed` (links the Stripe customer to the
        account), `customer.subscription.created` (on a first-ever subscription, still on the intro
        Price, converts it into a two-phase Subscription Schedule rather than recording it as-is —
        see `createBillingCheckout`) / `.updated` (records status, plan, `firstPeriod`,
        `current_period_end`, `cancel_at_period_end`), `customer.subscription.deleted` (account goes
        read-only), `invoice.paid` (confirms a renewal, and records `firstFullCharge` the first time
        a full-price invoice lands after a first period) and `invoice.payment_failed` (moves the
        account to `past_due`, which still writes — Stripe retries on its own schedule before
        eventually cancelling). The first-period-ending e-mail is not a webhook event at all — there
        is no Stripe trial in this design, so there is nothing for `trial_will_end` to fire on — it
        runs off a periodic check instead (`tickFirstPeriodNotices`, api/billing.js).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            description: The raw Stripe event payload — verified against `Stripe-Signature`, not parsed before that.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verified and applied (or already applied — see `duplicate`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  duplicate: { type: boolean }
        '400':
          description: '`Stripe-Signature` missing or not valid for this body and `STRIPE_WEBHOOK_SECRET`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid signature" }
        '404': { $ref: '#/components/responses/BillingOff' }

  /api/media/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        description: The SHA-256 of the file's bytes, 64 lowercase hex characters.
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    get:
      tags: [media]
      operationId: getMedia
      summary: Download one of your photos or videos
      description: |
        The stored file, whole, from the caller's own folder only: another profile's file
        answers exactly like one that was never uploaded (404). The body is the file, not
        JSON, with headers that keep a browser from ever treating it as a page:
        `Content-Type` from the sniffed type (never `text/*` or SVG),
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: default-src 'none'; sandbox`,
        `Cross-Origin-Resource-Policy: same-origin`, `Content-Disposition: inline`,
        `X-Robots-Tag: noindex` and `Cache-Control: private, no-store` — the app keeps its own
        verified copy, and an HTTP-cache copy would outlive signing out.

        No `Range` and no `ETag`: the app downloads a file once, checks it against its hash and
        keeps it. A paired phone fetches with its bearer token; `<img src>` cannot carry one.
        Not throttled.
      responses:
        '200':
          description: The file.
          headers:
            Content-Length: { schema: { type: integer } }
            Content-Disposition: { schema: { type: string }, example: 'inline; filename="<hash>.webp"' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/quicktime: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Not in the caller's folder — never uploaded, removed by the sweep, or someone else's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such file", code: "media-missing" }
    put:
      tags: [media]
      operationId: putMedia
      summary: Upload one photo, GIF or video
      description: |
        The body is the raw file; `Content-Type` must be one of the seven types below and
        `Content-Length` is optional (chunked uploads are capped while they stream). The path
        names the SHA-256 of the bytes, and the file is stored only if they hash to it.
        Idempotent: uploading a file the server already has answers 200 with `existed: true`.

        What is stored is decided by the file's first bytes, not by the declared type. The
        declared type only has to be in the same category — a still (JPEG, PNG, WebP, GIF) or a
        video (MP4, MOV, WebM): a JPEG declared as a GIF is stored as the JPEG it is, a video
        declared as an image is refused. The cap of the kind the bytes turned out to be applies
        (`MEDIA_IMAGE_MAX_MB`, `MEDIA_GIF_MAX_MB`, `MEDIA_VIDEO_MAX_MB`), and an MP4 or MOV must
        be a well-formed file no longer than `MEDIA_VIDEO_MAX_SEC` (+1 s), read from its
        headers. HEIC/AVIF, SVG, HTML and every other type are refused; the app converts HEIC
        photos before uploading. The server never decodes or alters a file: the app has already
        re-encoded photos and removed video metadata on the device.

        Checked in this order: session (401), the hourly budget and at most two uploads at once
        per profile (429), the declared type (415), a declared length over the cap (413 before
        a byte is read), already stored (200), the quota (413 `media-quota`; files the profile
        already dropped get one hour instead of the grace to make room), free disk (507), then
        while and after streaming: size (413), hash (400), sniffed type (415), sniffed cap
        (413), video checks (415/413). No bytes for 60 s ends the upload with 408. A refused
        upload is read and discarded up to twice its cap, so the answer reaches the client.

        A new file that the profile's state does not reference yet starts its grace period
        at once, so a state push that never comes does not keep it forever.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/quicktime: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaStored' }
              example: { ok: true, hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", mime: "image/webp", size: 183204, existed: false }
        '200':
          description: The server already had these bytes (from this or another of your devices).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaStored' }
              example: { ok: true, hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", mime: "image/webp", size: 183204, existed: true }
        '400':
          description: The bytes do not hash to the name in the path (`hash-mismatch`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the file does not match its name", code: "hash-mismatch" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }
        '408':
          description: No bytes arrived for 60 seconds (`timeout`). The connection is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the upload stalled", code: "timeout" }
        '413':
          description: |
            - `media-too-large` — over the cap of its kind; `maxMB` says the cap.
            - `media-quota` — the profile's space is full; `usedMB` and `quotaMB` say how full.
            - `media-too-long` — a video longer than `maxSec` seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLarge: { value: { error: "that file is too large", code: "media-too-large", maxMB: 2 } }
                quota: { value: { error: "your space for photos and videos is full", code: "media-quota", usedMB: 199.4, quotaMB: 200 } }
                tooLong: { value: { error: "that video is too long", code: "media-too-long", maxSec: 60 } }
        '415':
          description: >-
            `media-type` — the declared type is not one of the seven, the bytes are none of
            them, or they are a video declared as an image (or the reverse). `media-invalid` —
            an MP4 or MOV whose boxes do not add up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                type: { value: { error: "that file type is not accepted", code: "media-type" } }
                invalid: { value: { error: "that video could not be read", code: "media-invalid" } }
        '429':
          description: >-
            `locked` — more than `MEDIA_UPLOADS_PER_HOUR` uploads this hour; `busy` — two
            uploads of this profile are already in flight (`retryAfter` 5).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                locked: { value: { error: "too many uploads — try again later", code: "locked", retryAfter: 1740 } }
                busy: { value: { error: "too many uploads at once — try again in a moment", code: "busy", retryAfter: 5 } }
        '507':
          description: The server's disk has less than `MEDIA_MIN_FREE_MB` free (`storage-full`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the server is running out of disk space", code: "storage-full" }

  /api/media/missing:
    post:
      tags: [media]
      operationId: mediaMissing
      summary: Which of these files the server does not have
      description: |
        The app sends every hash its state references and uploads only what comes back, so the
        same call moves a guest's files into a new account, a phone's into its pairing, a
        backup's into the server, and re-sends a file the sweep removed while a device still
        had it. Answered from the caller's own folder only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  maxItems: 1000
                  items: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: The subset the server does not have, in the order sent, and the profile's usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  missing:
                    type: array
                    items: { type: string }
                  usage: { $ref: '#/components/schemas/MediaUsage' }
              example: { missing: ["b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9"], usage: { bytes: 52428800, count: 14, quotaBytes: 209715200 } }
        '400':
          description: '`hashes` is missing, not a list, longer than 1000, or holds something that is not a lowercase SHA-256 (`bad-request`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }

  /api/media/sweep:
    post:
      tags: [media]
      operationId: mediaSweep
      summary: Delete every file your current state does not reference
      description: |
        What "Reset everything" does after pushing the empty state: every stored file of the
        caller that the stored state does not reference goes now, without the grace period.
        A state that cannot be read removes nothing. At most 10 an hour per profile (429
        `locked`). Recorded in the activity log as `media.sweep`.

        Without this call nothing is lost either: the hourly sweep removes a file once the
        state has not referenced it for `MEDIA_GC_GRACE_DAYS` days (14), and only for profiles
        whose state reads — a missing or unreadable state, or a profile missing from `db.json`,
        never deletes anything.
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example: {}
      responses:
        '200':
          description: What was removed, and what is left.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
                  freedBytes: { type: integer }
                  usage: { $ref: '#/components/schemas/MediaUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A browser request from another origin (see *CSRF*).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cross-origin request refused" }
        '429':
          description: More than 10 sweeps this hour (`locked`).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "too many uploads — try again later", code: "locked", retryAfter: 1200 }

  /api/push/public-key:
    get:
      tags: [push]
      operationId: pushPublicKey
      summary: VAPID public key
      description: >-
        The instance's Web-Push application server key (generated once at first boot),
        for `PushManager.subscribe({applicationServerKey})`. Public.
      security: []
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: base64url-encoded P-256 public key.

  /api/push/subscribe:
    post:
      tags: [push]
      operationId: pushSubscribe
      summary: Register a Web-Push subscription
      description: |
        Stores the browser's `PushSubscription` for this account. Only `endpoint` and
        the two protocol keys are kept. The endpoint must be a public `https://` URL —
        private/loopback/link-local addresses are refused (here and again at send
        time, against DNS rebinding). At most 20 subscriptions per user; the oldest
        are dropped first. Re-subscribing an existing endpoint replaces it and keeps
        its original `created` — the client re-sends its subscription on every
        signed-in boot, so a row the instance lost comes back on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: '#/components/schemas/PushSubscription' }
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: >-
                    A token the browser made up for itself (stored in its localStorage),
                    so rest-timer pushes can be aimed at the device that started the
                    rest. Optional; anything that is not a short token is ignored.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Malformed subscription, or an endpoint that isn't acceptable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                malformed: { value: { error: "invalid subscription" } }
                private: { value: { error: "endpoint must not point at a private address" } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/status:
    get:
      tags: [push]
      operationId: pushStatus
      summary: Does the server hold this subscription?
      description: >-
        Whether the caller's account has a stored subscription with exactly this
        `endpoint`. The browser's `PushManager.getSubscription()` says nothing about
        the server's side — a row pruned after a dead send (404/410/403) leaves the
        browser subscribed to nowhere — so the client asks here before showing the
        notifications switch as on, and re-registers when the answer is no.
      parameters:
        - in: query
          name: endpoint
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/unsubscribe:
    post:
      tags: [push]
      operationId: pushUnsubscribe
      summary: Remove a Web-Push subscription
      description: Removes the caller's subscription with the given endpoint. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '200':
          description: Removed (or was never there).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/test:
    post:
      tags: [push]
      operationId: pushTest
      summary: Send a test notification
      description: >-
        Sends a test push to all of the caller's subscriptions (localized with the
        `lang` in their synced state). Returns 200 even if delivery to individual
        endpoints fails — dead endpoints (404/410, and 403 for a subscription made
        against a VAPID key the instance no longer has) are pruned as a side effect.
      responses:
        '200':
          description: Sends attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer:
    post:
      tags: [push]
      operationId: pushRestTimer
      summary: Schedule a server-side rest-timer push
      description: |
        Schedules one push after `seconds` (a number or numeric string ≥ 1, clamped to
        3600). One pending timer per
        device — `deviceId`, the same token the subscription was registered with; a
        new call from the same device replaces it, and the push goes only to that
        device's subscriptions. Without a `deviceId` there is one timer per account
        and the push goes to every subscription, as before. The client schedules this
        on rest start/extend and cancels on skip or on-screen completion — the push
        only actually fires when the tab was backgrounded/suspended and never got to
        cancel it. Timers live in memory: an API restart drops them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds:
                  type: number
                  minimum: 1
                  maximum: 3600
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: The browser's own token, see `POST /api/push/subscribe`. Optional.
            example: { seconds: 90, deviceId: "3f9c1d2e7b0a4c6d9e8f1a2b3c4d5e6f" }
      responses:
        '200':
          description: Timer scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: '`seconds` missing, not numeric, or below 1. Nothing is scheduled.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "seconds required" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/push/rest-timer/cancel:
    post:
      tags: [push]
      operationId: pushRestTimerCancel
      summary: Cancel the pending rest-timer push
      description: >-
        Cancels the caller's scheduled rest-timer push, if any. With a `deviceId` only
        that device's timer; without one, every pending timer of the account. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
      responses:
        '200':
          description: Cancelled (or nothing was pending).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/activity:
    post:
      tags: [activity]
      operationId: postActivity
      summary: Live-workout presence heartbeat
      description: |
        The client pings this every ~20 s while a workout is on screen; the admin
        dashboard reads who is training right now. Purely ephemeral, in-memory, never
        persisted; entries expire ~70 s after the last ping. `{"active": false}`
        drops the caller's entry immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: false ends the presence; true (with the fields below) updates it.
                name:
                  type: string
                  maxLength: 60
                  description: Routine/workout name being trained.
                exIdx: { type: integer, description: Current exercise index (0-based). }
                exTotal: { type: integer, description: Exercises in the workout. }
                setsDone: { type: integer }
                setsTotal: { type: integer }
                startedAt:
                  type: number
                  description: Workout start, ms since epoch (defaults to now).
            example:
              active: true
              name: "Push Day"
              exIdx: 2
              exTotal: 5
              setsDone: 7
              setsTotal: 16
              startedAt: 1756500000000
      responses:
        '200':
          description: Presence updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminUsers
      summary: 'Admin: list all users'
      description: >-
        One row per user with last sync, push status and whether they are training right
        now (`online`) — never which routine or how far into it (ISO-1447: an admin runs
        the instance, not its users' training). Admin only.
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserRow' }
                  invite_only: { type: boolean }
                  password_login: { type: boolean, description: Present (true) with PASSWORD_LOGIN=1. }
                  now:
                    type: number
                    description: Server time (ms) — for rendering relative times.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/user:
    get:
      tags: [admin]
      operationId: adminUser
      summary: 'Admin: one user in detail'
      description: >-
        Account and subscription only (ISO-1447) — no routines, bodyweight, workouts or
        unit: an admin runs the instance, not its users' training. `subscription` is
        null while the instance has no Stripe configured, otherwise the exact
        `GET /api/billing/status` shape for this account. Admin only.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: The user id.
      responses:
        '200':
          description: The user's detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/user/disable:
    post:
      tags: [admin]
      operationId: adminUserDisable
      summary: 'Admin: disable or re-enable a user'
      description: |
        Sets the `disabled` flag. A disabled account is locked out everywhere at once
        (every existing session stops resolving) and dropped from live presence.
        Admins cannot be disabled. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, disabled]
              properties:
                id: { type: string, description: The user id. }
                disabled: { type: boolean }
      responses:
        '200':
          description: Flag updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string }
                  disabled: { type: boolean }
        '400':
          description: Target is an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cannot disable an admin" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/user/role:
    post:
      tags: [admin]
      operationId: adminUserRole
      summary: 'Admin: grant or revoke the teacher role'
      description: |
        `role: "teacher"` grants it. `role: "student"` revokes it, and runs the full cascade
        (ISO-1609): every student still linked to this account is unlinked (`reason:
        "role-revoked"`), the teacher's notes about each of them are erased, each one's active
        assignment is closed, and the account's own outstanding class invites are deleted — all
        in one transaction. Audited as `teacher.role.grant` / `teacher.role.revoke`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, role]
              properties:
                id: { type: string, description: The user id. }
                role: { type: string, enum: [student, teacher] }
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string }
                  role: { type: string, enum: [student, teacher] }
        '400':
          description: role is neither "student" nor "teacher".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'role must be "student" or "teacher"' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/user/delete:
    post:
      tags: [admin]
      operationId: adminUserDelete
      summary: 'Admin: delete a user and everything of theirs'
      description: |
        Removes the account for good — the same deletion `DELETE /api/account` does for
        someone deleting themselves: the user record and everything that cascades from it,
        an active Stripe subscription and customer, uploaded photos and videos
        (`DATA_DIR/uploads/<uid>/`) and any Coach credential stored for them. Not
        reversible — `/api/admin/user/disable` is the reversible one. An admin cannot
        delete their own account (use `DELETE /api/account` instead), and the last admin
        cannot be deleted. Audited by name, since the id stops meaning anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The user id. }
      responses:
        '200':
          description: The account and everything of theirs is gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string }
        '400':
          description: Your own account, or the last admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "you cannot delete your own account" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such user" }

  /api/admin/invites:
    get:
      tags: [admin]
      operationId: adminInvites
      summary: 'Admin: list invite codes'
      description: All invite codes, with the redeeming user's name resolved for display.
      responses:
        '200':
          description: All invites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
                  invite_only: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/invites/new:
    post:
      tags: [admin]
      operationId: adminInviteNew
      summary: 'Admin: mint an invite code'
      description: >-
        Creates a fresh single-use invite code (16 hex chars = 64 bits — the code
        itself is the thing that isn't worth guessing; rate limiting is the reverse
        proxy's job). Audited.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 60
                  description: Free-form label ("for Alex").
      responses:
        '200':
          description: The new invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/invites/revoke:
    post:
      tags: [admin]
      operationId: adminInviteRevoke
      summary: 'Admin: revoke an unused invite code'
      description: Deletes an unused code. A code that was already redeemed cannot be revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: The code was already used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "already used — cannot revoke" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such code" }

  /api/admin/programs:
    get:
      tags: [admin]
      operationId: adminPrograms
      summary: 'Admin: list training programs'
      description: >-
        The active catalog by default (`trash=0`); `trash=1` lists the trash instead, ordered by
        when each was trashed, and ignores `status`. `q` matches title or description
        (case-insensitive; its own `%`/`_`/`\` are escaped, never treated as wildcards).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [strength, hypertrophy, conditioning, mobility, general] } }
        - { name: difficulty, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - { name: trash, in: query, schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200':
          description: The matching programs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs: { type: array, items: { $ref: '#/components/schemas/Program' } }
                  trashCount: { type: integer, description: 'How many programs are in the trash right now, regardless of `trash`.' }
        '400':
          description: An unknown category/difficulty/status filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/programs/meta:
    get:
      tags: [admin]
      operationId: adminProgramsMeta
      summary: 'Admin: program catalog enums and limits'
      description: Category/difficulty values with display labels, field limits, and the two configurable knobs (PROGRAM_TRASH_DAYS, PROGRAM_COVER_MAX_MB) — everything the form needs before it ever submits.
      responses:
        '200':
          description: Catalog metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  difficulties: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  limits: { type: object }
                  trashDays: { type: integer }
                  coverMaxMB: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/program:
    get:
      tags: [admin]
      operationId: adminProgram
      summary: 'Admin: one program, with its history'
      description: Works for a program in the trash too (§3.6 — an admin may always see it; only a future end-user route would answer 404 there).
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The program and its last 50 audit events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }
                  history: { type: array, items: { $ref: '#/components/schemas/ProgramEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/programs/new:
    post:
      tags: [admin]
      operationId: adminProgramNew
      summary: 'Admin: create a training program'
      description: Always created with rev 1. Title must be unique (case-insensitive) among active programs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, difficulty, sessionMinutes]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                description: { type: string, maxLength: 5000 }
                category: { type: string, enum: [strength, hypertrophy, conditioning, mobility, general] }
                difficulty: { type: string, enum: [beginner, intermediate, advanced] }
                sessionMinutes: { type: integer, minimum: 1, maximum: 600 }
                status: { type: string, enum: [draft, published], default: draft }
      responses:
        '200':
          description: The new program.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '400':
          description: A field failed validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "title must be 3-120 characters", field: title }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Another active program already has this title.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a program with this title already exists", code: title-taken }

  /api/admin/program/update:
    post:
      tags: [admin]
      operationId: adminProgramUpdate
      summary: 'Admin: edit, publish or unpublish a program'
      description: >-
        Partial — only the fields present are validated and changed. `rev` must match the
        program's current revision or this answers `409 {code: stale, current}` without writing
        anything. A program in the trash answers `409 {code: in-trash}` — it is read-only until
        restored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, rev]
              properties:
                id: { type: string }
                rev: { type: integer }
                title: { type: string }
                description: { type: string }
                category: { type: string, enum: [strength, hypertrophy, conditioning, mobility, general] }
                difficulty: { type: string, enum: [beginner, intermediate, advanced] }
                sessionMinutes: { type: integer }
                status: { type: string, enum: [draft, published] }
      responses:
        '200':
          description: The updated program.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '400':
          description: A field failed validation, or id/rev are missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Stale rev, title taken, or the program is in the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "changed since you loaded it", code: stale, current: {} }

  /api/admin/program/trash:
    post:
      tags: [admin]
      operationId: adminProgramTrash
      summary: 'Admin: move a program to the trash'
      description: Disappears from the active catalog at once. Restorable for PROGRAM_TRASH_DAYS, after which it is purged automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id, rev], properties: { id: { type: string }, rev: { type: integer } } }
      responses:
        '200':
          description: Trashed.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Stale rev, or already in the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/program/restore:
    post:
      tags: [admin]
      operationId: adminProgramRestore
      summary: 'Admin: restore a program out of the trash'
      description: Always comes back as a draft — republishing is a separate, explicit step.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200':
          description: Restored, as a draft.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Not in the trash, or another active program already has this title.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/program/purge:
    post:
      tags: [admin]
      operationId: adminProgramPurge
      summary: 'Admin: permanently delete a program from the trash'
      description: >-
        Only works on a program already in the trash, and only with `confirmTitle` matching the
        program's title exactly (the server re-checks this — the client's own "type the title"
        gate is not trusted alone). There is no undo past this call; `program_events` keeps the
        history, the row itself does not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, confirmTitle]
              properties: { id: { type: string }, confirmTitle: { type: string } }
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: confirmTitle does not match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "the typed title does not match", code: confirm-mismatch }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The program is not in the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/program/cover:
    put:
      tags: [admin]
      operationId: adminProgramCoverSet
      summary: 'Admin: set or replace a program''s cover image'
      description: >-
        The body is the raw, already-cropped (16:9) image — `w`/`h`/`alt` ride the query string
        since the body is the file itself. Validated by magic number (jpg/png/webp only — SVG,
        GIF and video are refused); `PROGRAM_COVER_MAX_MB` caps the size (default 5, itself
        capped by the server's overall body limit). `alt` is required and must describe the
        image, not restate the title or the filename.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: rev, in: query, required: true, schema: { type: integer } }
        - { name: w, in: query, required: true, schema: { type: integer }, description: Width of the already-cropped image. }
        - { name: h, in: query, required: true, schema: { type: integer }, description: Height of the already-cropped image. }
        - { name: alt, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 200 } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The program, with its new cover.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '400':
          description: id/rev missing, or the dimensions/alt text failed validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Stale rev, or the program is in the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: The file is larger than PROGRAM_COVER_MAX_MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Not a JPEG, PNG or WebP image by magic number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "cover must be a JPEG, PNG or WebP image" }
    get:
      tags: [admin]
      operationId: adminProgramCoverGet
      summary: 'Admin: the program''s cover image bytes'
      description: >-
        Works for a program in the trash too — same admin-only visibility as GET /api/admin/program.
        The response is cacheable forever (`immutable`): the filename is the content's own hash,
        so a changed cover is always a new URL.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: v, in: query, schema: { type: string }, description: Cache-busting hint for the client; ignored by the server. }
      responses:
        '200':
          description: The image bytes.
          content: { image/jpeg: {}, image/png: {}, image/webp: {} }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program, or it has no cover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/program/cover/remove:
    post:
      tags: [admin]
      operationId: adminProgramCoverRemove
      summary: 'Admin: remove a program''s cover image'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id, rev], properties: { id: { type: string }, rev: { type: integer } } }
      responses:
        '200':
          description: The program, without a cover.
          content:
            application/json:
              schema: { type: object, properties: { program: { $ref: '#/components/schemas/Program' } } }
        '400':
          description: id/rev missing, or there is no cover to remove.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no cover to remove", code: no-cover }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Stale rev, or the program is in the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/audit:
    get:
      tags: [admin]
      operationId: adminAudit
      summary: 'Admin: read the activity log'
      description: |
        The audit log (sign-ins, failed attempts, admin actions), newest first, paged
        by event id (`before` cursor — offset paging would repeat rows as new events
        land). Retention (`AUDIT_MAX` events / `AUDIT_DAYS` days) is applied on read
        as well as on the hourly compaction. When `AUDIT_LOG` is off the route still
        answers, with `enabled: false` and whatever was logged before.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
          description: Page size.
        - name: before
          in: query
          schema: { type: integer }
          description: Only events with id < before (cursor from `nextBefore`).
        - name: cat
          in: query
          schema:
            type: string
            enum: [auth, admin, fail]
          description: >-
            Filter — `fail` keeps only failed events; any other value keeps events
            whose name starts with `<cat>.` (in practice `auth` or `admin`).
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  total:
                    type: integer
                    description: Rows matching the filter (after retention).
                  nextBefore:
                    oneOf: [{ type: integer }, { type: 'null' }]
                    description: Cursor for the next page; null on the last page.
                  enabled:
                    type: boolean
                    description: Whether audit logging is currently on (AUDIT_LOG).
                  ip_mode:
                    type: string
                    enum: [off, net, full]
                    description: How much of the caller IP is recorded (AUDIT_IP).
                  retention:
                    type: object
                    properties:
                      max: { type: integer, description: 'Event cap (0 = none).' }
                      days: { type: integer, description: 'Age cap in days (0 = none).' }
                  now: { type: number, description: Server time (ms). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit/clear:
    post:
      tags: [admin]
      operationId: adminAuditClear
      summary: 'Admin: clear the activity log'
      description: >-
        Deletes the log file. The clear is itself the first event of the fresh log,
        and event ids are never reset — a wipe always leaves a visible id gap.
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- AI Coach
  # The routes live in api/coach/routes.js and are mixed into the same route table as
  # everything above; they are inert — 503 — while the instance has no Coach enabled
  # and connected.

  /api/coach/disclosure:
    get:
      tags: [coach]
      operationId: getCoachDisclosure
      summary: What the consent screen must say
      description: |
        The categories of data a Coach job would send, and the provider it would go to,
        read straight from the module that builds the payload — so the consent screen
        cannot drift from what actually leaves the box.

        Needs a session but *not* a connected Coach: the screen that collects consent
        runs before there is anything to consent to.
      responses:
        '200':
          description: The disclosure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, description: "Provider id, e.g. `anthropic`." }
                  providerLabel: { type: string }
                  categories:
                    type: array
                    items: { type: string, enum: [plan, training, bodyweight, profile, prefs] }
                    description: The data categories a job may send. Nothing else ever is.
                  version: { type: integer, description: Disclosure version the consent is recorded against. }
              example:
                provider: anthropic
                providerLabel: Claude
                categories: [plan, training, bodyweight, profile, prefs]
                version: 1
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/status:
    get:
      tags: [coach]
      operationId: getCoachStatus
      summary: The running job, the waiting proposal and today's budget
      description: |
        What the Coach screen polls. Also the only place a proposal past its 14-day
        expiry is retired — a phone that stays closed never polls, so nothing else
        would notice.
      responses:
        '200':
          description: This profile's Coach state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/plan:
    post:
      tags: [coach]
      operationId: postCoachPlan
      summary: Ask for a training plan
      description: |
        Queues a `create` job. With `intake` it builds a plan from the answers given on
        the intake screen; with `refine` it reworks the proposal already waiting, in the
        words of the person reading it. The answer is 202 and a job id — the result
        arrives through `GET /api/coach/status`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                intake:
                  $ref: '#/components/schemas/CoachIntake'
                refine:
                  type: string
                  maxLength: 4000
                  description: |
                    A change asked for in plain words, applied to the proposal now waiting. Cut to
                    the instance's `maxMessageLen` (1000 unless the admin changed it; 200–4000).
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
            example: { intake: { goal: muscle, experience: novice, daysPerWeek: 3, equipment: [dumbbell, barbell] } }
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/review:
    post:
      tags: [coach]
      operationId: postCoachReview
      summary: Ask for a review of the training since the last one
      description: |
        Queues a `review` job — the same job the weekly cadence queues on its own. The
        answer is either a change-set to accept or reject, or "nothing to change" with
        the reason, both delivered through `GET /api/coach/status`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: |
                    Anything the profile wants the Coach to know this time round. Cut to the
                    instance's `maxMessageLen` (1000 unless the admin changed it; 200–4000).
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/debrief:
    post:
      tags: [coach]
      operationId: postCoachDebrief
      summary: Ask for a read of one session
      description: |
        Queues a `debrief` job: one workout, read closely. It changes nothing — the card
        it produces is kept in the profile's log. With no `workoutId` the most recent
        session is read.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutId:
                  oneOf: [{ type: string, maxLength: 40 }, { type: 'null' }]
                  description: The workout to read; null or absent means the latest.
                lang:
                  type: string
                  pattern: '^[A-Za-z]{2,3}([-_][A-Za-z0-9]{2,8})?$'
                  description: |
                    The language the app is showing, which the Coach writes in. Absent or not a
                    language tag, the profile's stored `lang` is used.
      responses:
        '202': { $ref: '#/components/responses/CoachJobQueued' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CoachRefused' }
        '409': { $ref: '#/components/responses/CoachRefused' }
        '429': { $ref: '#/components/responses/CoachRefused' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/pending/resolve:
    post:
      tags: [coach]
      operationId: postCoachResolve
      summary: Apply or discard the waiting proposal
      description: |
        The client applies the accepted changes to its own state and syncs them through
        `PUT /api/data`; this only records the decision and clears the proposal. Sending
        it when nothing is waiting is a no-op, not an error.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: array
                  items: { type: string }
                  description: Ids of the changes the person kept.
                rejected:
                  type: array
                  items: { type: string }
                  description: Ids of the changes they turned down.
                dismissed:
                  type: boolean
                  description: True when the whole proposal was thrown away unread.
      responses:
        '200':
          description: Recorded; the proposal is cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort:
    get:
      tags: [coach]
      operationId: getCoachCohort
      summary: How this profile sits against the others who opted in
      description: |
        Medians only, and only when at least three profiles on the instance share. Nothing
        at all for a profile that does not share itself, or on an instance where the admin
        has not switched the comparison on — each of those is a 200 saying which it is.
      responses:
        '200':
          description: The comparison, or the reason there isn't one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachCohort' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/cohort/share:
    post:
      tags: [coach]
      operationId: postCoachCohortShare
      summary: Opt this profile in or out of the comparison
      description: >-
        Held server-side rather than in the synced state: this flag decides whether the
        profile's numbers reach other people, and a stale device syncing an older copy
        must not be able to turn it back on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share: { type: boolean }
            example: { share: true }
      responses:
        '200':
          description: The flag as it now stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  sharing: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/CoachOff' }

  /api/coach/account:
    get:
      tags: [coach]
      operationId: getCoachAccount
      summary: Whose provider account this profile would spend
      description: >-
        Its own route because both the Coach screen and the admin card have to state it,
        and neither should be inferring it from settings. In instance mode a personal
        credential binds to the first profile that spends it; every other profile is
        refused outright rather than warned, and `reason` says so.
      responses:
        '200':
          description: The account this profile's jobs would run on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [instance, profile] }
                  provider: { type: string }
                  providerLabel: { type: string }
                  account:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: What the admin labelled the credential, when there is one.
                  connected: { type: boolean }
                  reason:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: Why not, when `connected` is false — e.g. `shared-account`.
                  message:
                    oneOf: [{ type: string }, { type: 'null' }]
                    description: The refusal in the app's own voice, ready to show.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/coach/forget:
    post:
      tags: [coach]
      operationId: postCoachForget
      summary: Drop everything the server holds for this profile
      description: |
        Consent withdrawn, or the Coach switched off for this profile: the job record,
        the waiting proposal, the history and the sharing flag go at once, without waiting
        for a sync to carry the news. A job already running is cancelled where the adapter
        allows it and writes nothing back either way.

        Today's job count is the one thing that survives — it is the spending record the
        daily cap reads, and forgetting must not hand out a fresh cap.

        Needs a session only: a profile must be able to be forgotten on an instance whose
        Coach has since been switched off.
      responses:
        '200':
          description: Forgotten.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/coach:
    get:
      tags: [admin, coach]
      operationId: getAdminCoach
      summary: 'Admin: the Coach card'
      description: |
        Everything the admin screen renders in one round trip, including a live check of
        the configured provider — for a runtime provider "is the runtime there", for an
        HTTPS one the model list its stored key can see.

        Counts and outcomes only: no intake answers, no payloads, no proposals, and never
        a credential — only whether one is filed and what it is labelled.
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoach' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/config:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachConfig
      summary: 'Admin: change the Coach settings'
      description: |
        A patch — every field is optional and only what is sent is changed. Model,
        endpoint and credential are all keyed by provider, so switching provider never
        drops any of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string, description: "Must be one of the ids GET /api/admin/coach lists." }
                model:
                  type: string
                  maxLength: 80
                  description: For the provider being set (or the current one). Empty string clears it.
                baseUrl:
                  type: string
                  description: |
                    Only for a provider with a configurable endpoint; validated before it is stored.
                    Empty means "back to the default", so it is refused for a provider that has none.
                community: { type: boolean, description: Offer the cohort comparison on this instance. }
                caps:
                  type: object
                  properties:
                    perProfileDaily: { type: integer, minimum: 0, maximum: 200, description: 0 = no cap. }
                    instanceDaily: { type: integer, minimum: 0, maximum: 5000, description: 0 = no cap. }
                maxMessageLen:
                  type: integer
                  minimum: 200
                  maximum: 4000
                  description: How long a chat message, refinement or review note can be. Clamped into the range; not a number keeps the current value.
            example: { enabled: true, provider: compatible, model: qwen3.8-27b, caps: { perProfileDaily: 10, instanceDaily: 0 } }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: |
            Unknown provider, an endpoint set on a provider that has a fixed one, a base URL that
            did not validate, or an empty one for a provider with no default endpoint to fall back
            to (`compatible`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown provider" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/test:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachTest
      summary: 'Admin: run one round trip against the provider'
      description: |
        Checks the runtime, then asks the model for one fixed JSON object and validates
        the shape that comes back — the whole path a job takes, on nobody's profile.

        Always 200: the outcome is in the body, because "the provider refused" is an
        answer to the question the button asks, not a failure of the request. It brings
        the two short upstream retry pauses rather than `COACH_RETRY_DELAYS_MS`, since
        an admin is watching it through a proxy with a timeout of its own.
      responses:
        '200':
          description: The result of the round trip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version:
                    type: string
                    description: What the runtime reported, when it could be asked.
                  error:
                    type: string
                    description: Present when `ok` is false — the provider's own words, trimmed.
              examples:
                ok: { value: { ok: true, version: "1.2.3" } }
                refused: { value: { ok: false, error: "401 invalid x-api-key" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/models:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachModels
      summary: 'Admin: list the models the endpoint serves'
      description: >-
        So the card can offer a list rather than a text field that goes stale with every
        model release. HTTPS providers only; a provider that cannot be asked answers
        `ok: false` with an empty list rather than an error status.
      responses:
        '200':
          description: The models, or why there are none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  models:
                    type: array
                    items: { type: string }
                  error: { type: string }
              example: { ok: true, models: [qwen3.8-27b, gpt-oss-120b] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/connect:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachConnect
      summary: 'Admin: file the provider credential'
      description: |
        The token is accepted once and never read back: it is encrypted with the
        instance secret and leaves again only as an environment variable on a job's child
        process. `type` has to match a variable the provider actually declares, so a key
        for one provider cannot be filed under another and then silently go nowhere.

        A key may be filed for a provider that is not the active one, so the chips can be
        prepared before switching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, token]
              properties:
                provider: { type: string, description: Defaults to the active provider. }
                type:
                  type: string
                  enum: [cli-token, oauth, apikey]
                token: { type: string, description: "Never returned by any route, ever." }
                account:
                  type: string
                  maxLength: 120
                  description: A label for whose account this is — shown on the card.
            example: { type: apikey, token: "sk-…", account: "team@example.com" }
      responses:
        '200':
          description: Filed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Unknown provider, a credential type that provider does not take, or no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no token supplied" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/coach/disconnect:
    post:
      tags: [admin, coach]
      operationId: postAdminCoachDisconnect
      summary: 'Admin: remove the provider credential'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, description: Defaults to the active provider. }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: Unknown provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown provider" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/teacher/students:
    get:
      tags: [teacher]
      operationId: teacherStudents
      summary: 'Teacher: every linked student, with a summary'
      description: |
        For each active link: the student's name, their current assignment if any, and a
        summary (`lastWorkoutAt`, `workoutsThisWeek`, `adherence`, `idleDays`, `idle`) computed
        over `teacherView`, never the raw state. Pending invites are `GET /api/teacher/invites`,
        not this list.
      responses:
        '200':
          description: The roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  students:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherStudentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/teacher/student:
    get:
      tags: [teacher]
      operationId: teacherStudent
      summary: 'Teacher: one student in detail'
      description: |
        `teacherView(state, { bodyweight: link.shareBodyweight })` plus the scope version the
        student accepted, whether body weight is currently shared, the summary, the active
        assignment and the ten most recent ended ones. The link is re-read from the database on
        this exact request (D10): unlinking, losing the role, or the student turning off body
        weight all cut access off immediately, not on the next cache refresh. Audited as
        `teacher.student.view` — reading another person's training data is worth a trail.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: The student's user id.
      responses:
        '200':
          description: The student's allowlisted view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherStudentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not a teacher, or not this student's teacher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/teacher/student/remove:
    post:
      tags: [teacher]
      operationId: teacherStudentRemove
      summary: 'Teacher: end the link with a student'
      description: |
        Same effect as the student unlinking themselves, from the other side: the link ends, the
        teacher's notes about them are erased, and any active assignment is closed
        (`end_reason: "unlinked"`). The routine already imported stays with the student, marked
        as ended by the teacher. Audited as `teacher.link.end`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The student's user id. }
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }

  /api/teacher/student/assign:
    post:
      tags: [teacher]
      operationId: teacherStudentAssign
      summary: 'Teacher: assign (or replace) a routine or Program'
      description: |
        `kind: "routine"` carries a validated snapshot in `routine` (never a live reference to
        the teacher's own library — editing the library afterwards never changes what the
        student already received). `kind: "program"` carries `programId` of a currently
        published Program. `startsOn`/`days` go through the same schedule validation either way.
        If the student already has an active assignment, this replaces it
        (`end_reason: "replaced"`) in the same transaction that creates the new one — at most one
        stays active (D14), enforced by the database, so two requests racing the same student can
        only ever leave one of them active; the other gets `assignment-conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind, startsOn]
              properties:
                id: { type: string, description: The student's user id. }
                kind: { type: string, enum: [routine, program] }
                routine:
                  type: object
                  description: Required when kind is "routine". { name, ex: [...], customEx?: [...] }.
                programId: { type: string, description: Required when kind is "program". Must be published. }
                startsOn: { type: string, description: YYYY-MM-DD, within 7 days in the past to 60 in the future. }
                days:
                  oneOf: [{ type: 'null' }, { type: array, items: { type: integer, minimum: 0, maximum: 6 } }]
                  description: Weekdays, 0 = Sunday .. 6 = Saturday (same index as S.week). Omit/null for no fixed schedule.
            example: { id: "s_abc123", kind: "routine", routine: { name: "Full body A", ex: [{ id: "0001", sets: 3, reps: 10, weight: 20 }] }, startsOn: "2026-11-01", days: [1, 3, 5] }
      responses:
        '200':
          description: The new active assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment: { $ref: '#/components/schemas/TeacherAssignmentBrief' }
        '400':
          description: Bad schedule, bad routine shape, or programId is not a published Program.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
        '409':
          description: Two assigns raced the same student; this one lost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another assignment is already active for this student", code: "assignment-conflict" }

  /api/teacher/student/assignment/end:
    post:
      tags: [teacher]
      operationId: teacherStudentAssignmentEnd
      summary: 'Teacher: end the active assignment without replacing it'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: The student's user id. }
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
        '404':
          description: No active assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no active assignment", code: "no-active-assignment" }

  /api/teacher/student/notes:
    get:
      tags: [teacher]
      operationId: teacherStudentNotes
      summary: 'Teacher: the private notes about one student'
      description: |
        Only the student's current teacher ever reads these (D13) — not the student, not an
        ex-teacher: ending the link erases them in the same transaction.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: The student's user id.
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
    post:
      tags: [teacher]
      operationId: teacherStudentNoteCreate
      summary: 'Teacher: add a note about a student'
      description: >-
        Up to 4000 characters, up to 500 notes per student. Audited as `teacher.note.create` —
        never the text itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, body]
              properties:
                id: { type: string, description: The student's user id. }
                body: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/TeacherNote' }
        '400':
          description: '`note-empty` or `note-too-long`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
        '409':
          description: Already at 500 notes for this student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a teacher can have at most 500 notes per student", code: "notes-limit" }

  /api/teacher/student/notes/update:
    post:
      tags: [teacher]
      operationId: teacherStudentNoteUpdate
      summary: 'Teacher: edit a note'
      description: >-
        The id is scoped to this teacher *and* this student — a note id from another pair
        answers the same `note-not-found` as one that does not exist at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, noteId, body]
              properties:
                id: { type: string, description: The student's user id. }
                noteId: { type: string }
                body: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: { $ref: '#/components/schemas/TeacherNote' }
        '400':
          description: '`note-empty` or `note-too-long`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
        '404':
          description: No note with that id for this teacher and student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such note", code: "note-not-found" }

  /api/teacher/student/notes/delete:
    post:
      tags: [teacher]
      operationId: teacherStudentNoteDelete
      summary: 'Teacher: delete a note'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, noteId]
              properties:
                id: { type: string, description: The student's user id. }
                noteId: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotYourStudent' }
        '404':
          description: No note with that id for this teacher and student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no such note", code: "note-not-found" }

  /api/teacher/programs:
    get:
      tags: [teacher]
      operationId: teacherPrograms
      summary: 'Teacher: the published Program catalog'
      description: Title, description, category, difficulty and whether it has a cover — to assign directly, or as a starting point in the teacher's own library (ISO-1610).
      responses:
        '200':
          description: Published Programs only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string }
                        category: { type: string }
                        difficulty: { type: string }
                        hasCover: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/teacher/program/cover:
    get:
      tags: [teacher]
      operationId: teacherProgramCover
      summary: 'Teacher: a published Program''s cover image'
      description: >-
        Same stream as `GET /api/admin/program/cover`, gated to teachers instead of admins and
        narrowed to Programs that are currently published — a draft's or a trashed one's cover
        is exactly as unreachable here as the program itself.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The image bytes.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such Program, not published, or no cover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/teacher/invites:
    get:
      tags: [teacher]
      operationId: teacherInvites
      summary: 'Teacher: active class invite codes'
      description: The code itself is never stored or re-shown — only the hash, a note and when it expires. Expired codes drop off this list on their own.
      responses:
        '200':
          description: Active invites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        hash: { type: string }
                        note: { type: string }
                        created: { type: string }
                        expires: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/teacher/invites/new:
    post:
      tags: [teacher]
      operationId: teacherInvitesNew
      summary: 'Teacher: make a class invite code'
      description: >-
        Good for 30 days, for one student (first redeemer wins). Up to 20 active at once.
        Audited as `teacher.invite.create`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 60, description: A free-text label ("Tuesday class"). }
      responses:
        '200':
          description: The code, in clear, once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      code: { type: string }
                      expires: { type: number }
                      note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Already at 20 active invites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a teacher can have at most 20 active invites", code: "invite-limit" }

  /api/teacher/invites/revoke:
    post:
      tags: [teacher]
      operationId: teacherInvitesRevoke
      summary: 'Teacher: revoke an unused class invite code'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash: { type: string }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such invite for this teacher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/teacher-invite/preview:
    post:
      tags: [teacher]
      operationId: teacherInvitePreview
      summary: 'Student: preview a class invite code'
      description: |
        Does not consume the code. Returns exactly the allowlist the accept screen shows, so
        what is disclosed and what is actually shared can never drift apart (D5). Wrong guesses
        share the per-address pause device-link codes use (see *Throttling*).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: What accepting this code would share.
          content:
            application/json:
              schema:
                type: object
                properties:
                  teacher: { type: object, properties: { name: { type: string } } }
                  scope: { type: array, items: { type: string } }
                  scopeOptional: { type: array, items: { type: string } }
                  scopeNever: { type: array, items: { type: string } }
                  scopeVersion: { type: integer }
        '400':
          description: Wrong, used or expired code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invite is invalid or expired", code: "invite-invalid" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/teacher-invite/accept:
    post:
      tags: [teacher]
      operationId: teacherInviteAccept
      summary: 'Student: accept a class invite code'
      description: |
        Claims the code atomically (of two requests racing the same one, exactly one links) and
        records the exact scope version accepted. `shareBodyweight` is its own opt-in, off unless
        set `true` here — a separate, specific tick, never bundled into accepting the teacher
        itself (D12). A code already claimed, self-invited, or used by an account that already
        has a teacher all refuse without the code having been spent on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, scopeVersion]
              properties:
                code: { type: string }
                scopeVersion: { type: integer, description: Must equal the current TEACHER_SCOPE_VERSION. }
                shareBodyweight: { type: boolean, default: false }
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  teacherId: { type: string }
        '400':
          description: '`invite-invalid`, `invite-expired` or `self-invite`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`already-has-teacher` (code not consumed) or `scope-outdated`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "another assignment is already active for this student", code: "already-has-teacher" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/account/teacher:
    get:
      tags: [teacher]
      operationId: accountTeacher
      summary: 'Student: the linked teacher, if any'
      responses:
        '200':
          description: '`{ teacher: null }` with no link.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  teacher:
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties: { id: { type: string }, name: { type: string } }
                  acceptedAt: { type: string }
                  scope: { type: array, items: { type: string } }
                  shareBodyweight: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [teacher]
      operationId: accountTeacherDelete
      summary: 'Student: unlink from the current teacher'
      description: >-
        Erases the teacher's notes about this student and closes out the active assignment
        (`end_reason: "unlinked"`) — the routine already imported stays with the student, marked
        as ended. A no-op, not an error, with no link at all. Audited as `teacher.link.end`.
      responses:
        '200':
          description: Unlinked (or already was).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/account/teacher/bodyweight:
    post:
      tags: [teacher]
      operationId: accountTeacherBodyweight
      summary: 'Student: turn body-weight sharing on or off'
      description: >-
        The opt-in itself (D12) — on at any time from "Meu professor", independent of the base
        scope accepted at link time. Each change is a durable event
        (`teacher_link_events.action`), proof of consent for this one sensitive field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share]
              properties:
                share: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  share: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No teacher linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "no teacher linked", code: "not-found" }

  /api/account/assignments:
    get:
      tags: [teacher]
      operationId: accountAssignments
      summary: 'Student: assignments waiting to be imported or acknowledged as ended'
      description: |
        Independent of whether a link still exists — the `ended` half still has to reach a
        student who has since unlinked. `pending`: active, not yet imported
        (`delivered_at IS NULL`). `ended`: was imported, now ended, not yet acknowledged
        (D8 — the client marks the already-imported routine as ended by the teacher, then acks).
      responses:
        '200':
          description: Both lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherAssignmentDelivery' }
                  ended:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherAssignmentDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/account/assignments/ack:
    post:
      tags: [teacher]
      operationId: accountAssignmentsAck
      summary: 'Student: acknowledge an assignment (imported, or noticed it ended)'
      description: Marks `delivered_at` if it was pending, or `end_acked_at` if it was ended. Only the assignment's own student may ack it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such assignment for this student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gymsid
      description: |
        HMAC-signed session cookie, set by `register/verify` / `login/verify`.
        On HTTPS deployments it is issued as **`__Host-gymsid`** (host-locked,
        Secure); the unprefixed `gymsid` is what a plain-http `localhost` instance
        uses, and is still accepted for pre-upgrade sessions. HttpOnly + SameSite=Lax;
        browser clients never handle the value directly.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The same signed session token, carried as `Authorization: Bearer <token>` by
        the paired mobile app (obtained from `POST /api/pair/redeem`). Bearer requests
        skip the CSRF origin check — a browser never attaches this header on its own.

  responses:
    Unauthorized:
      description: No session, expired/revoked session, or a disabled account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not signed in" }
    Forbidden:
      description: Signed in, but not an admin. The attempt is recorded in the audit log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "forbidden" }
    CoachOff:
      description: >-
        The Coach is not set up on this instance — switched off, or no provider connected.
        Every Coach route answers this rather than pretending, so an unconfigured instance
        renders exactly the app it was before the feature existed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the Coach is not set up on this instance" }
    CoachJobQueued:
      description: >-
        Queued. The job runs in the background; its outcome arrives through
        `GET /api/coach/status`, which the client polls.
      content:
        application/json:
          schema:
            type: object
            properties:
              job:
                type: object
                properties:
                  id: { type: string, description: 16 hex characters. }
          example: { job: { id: "9f1c2d3e4a5b6c7d" } }
    CoachRefused:
      description: |
        The Coach will not take this job, and says which reason in `code`:

        - `busy` (409) — a job for this profile is already running.
        - `shared` (409) — instance mode, and the credential belongs to another profile.
        - `cap` (429) — this profile's or the instance's daily limit is spent.
        - `consent` (403) — no consent recorded for this profile.
        - `unprivileged` (503) — the privilege drop cannot be performed, so no job runs.

        The message is the one to show; the raw provider detail never reaches the user.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [off, busy, cap, consent, shared, unprivileged] }
          example: { error: "the Coach is already thinking about your training", code: busy }
    TooManyRequests:
      description: >-
        Paused by the sign-in throttle (see *Throttling* in the description). The request
        was not looked at; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the pause ends.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "too many attempts — try again later", code: "locked", retryAfter: 60 }
    Busy:
      description: Every password check slot and the short queue behind them are taken.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the server is busy — try again in a moment", code: "busy" }
    PasswordPolicy:
      description: >-
        The new password breaks the policy — `too-short` (under 10 characters),
        `too-long` (over 256) or `too-common` — or a field is `missing`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "this password is too easy to guess", code: "too-common" }
    NameTaken:
      description: >-
        Another profile already signs in with this name, or holds it with a reset code
        that has not been used or expired yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "another profile already signs in with this name", code: "name-taken" }

    ProofRefused:
      description: >-
        No acceptable proof that the owner is here: `passkey-required` (no password that
        counts — none is set, or `PASSWORD_LOGIN` is off — so a passkey has to confirm),
        `passkey` (the assertion did not verify, belongs to another profile, or was made
        for another challenge, one handed out for another ceremony or one already used),
        `current-required`, `current-wrong`, or `google-proof-invalid` (tag `google`) —
        `googleProof` is missing, expired, already used, or was minted for a different
        account or session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "confirm with your passkey first", code: "passkey-required" }
    PasskeyLimit:
      description: The profile already has the most passkeys it can have (20).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "a profile can have at most 20 passkeys", code: "passkey-limit" }
    LinkInvalid:
      description: >-
        The code is wrong, used, replaced or expired, or its profile is gone or disabled —
        one answer for all of them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "that code is wrong, used or expired", code: "link-invalid" }
    SubscriptionRequired:
      description: >-
        No active subscription (tag `billing`) — only while the instance has `STRIPE_API_KEY`/
        `STRIPE_WEBHOOK_SECRET` set; off otherwise. `canWrite` (api/billing.js): `active` or
        `past_due` both count, nothing else. Reading and exporting the account's history are never
        gated this way, only this write.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "an active subscription is required to save changes", code: "billing" }
    BillingOff:
      description: >-
        This instance has no `STRIPE_API_KEY`/`STRIPE_WEBHOOK_SECRET` set — every `billing` route
        except `GET /api/billing/status` is a 404, same as every other env-gated feature.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "billing not configured" }
    NotYourStudent:
      description: >-
        One uniform answer for every way a student can be "not this teacher's" — the id does not
        exist, belongs to another teacher, or was once linked but is not any more: an unknown id
        and a real one tell a guessing teacher nothing apart.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not your student", code: "not-your-student" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. This is the only error shape the API has.
        code:
          type: string
          description: >-
            A stable reason on the password, throttle and media routes, for a client to word
            in its own language (`bad-credentials`, `locked`, `too-short`, `media-quota`, …).
            Media refusals add the numbers to word it with (`maxMB`, `maxSec`, `usedMB`,
            `quotaMB`).
        retryAfter:
          type: integer
          description: 429 only — the same number of seconds as the Retry-After header.

    Ok:
      type: object
      properties:
        ok: { type: boolean, const: true }

    PasskeyList:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: WebAuthn credential id (base64url). }
              name: { oneOf: [{ type: string }, { type: 'null' }] }
              created: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
              lastUsed: { oneOf: [{ type: string }, { type: 'null' }], description: 'ISO timestamp of the last sign-in or confirmation with it.' }
              transports: { type: array, items: { type: string } }
        password:
          type: boolean
          description: >-
            The profile has a password and `PASSWORD_LOGIN` is on, so `current` can prove
            an addition or a removal.
        lastWayIn:
          type: boolean
          description: Removing any one passkey would be refused (409 `last-way-in`).
      example:
        passkeys: [{ id: "g3Xq…", name: "Laptop", created: "2026-09-23T10:00:00.000Z", lastUsed: "2026-09-23T10:00:00.000Z", transports: [internal] }]
        password: false
        lastWayIn: true

    OwnerProof:
      type: object
      description: >-
        A passkey assertion made for this request (`cid` + `credential`); the profile's
        current password (`current`, counts only while `PASSWORD_LOGIN` is on); or a
        one-time Google reauthentication proof (`googleProof`, tag `google`) — the third
        option, for a profile with neither a password nor a passkey. Each is good for one
        request: a passkey challenge or a Google proof is spent by using it.
      properties:
        cid: { type: string, description: 'From POST /api/login/options.' }
        credential: { $ref: '#/components/schemas/WebAuthnAuthenticationCredential' }
        current: { type: string }
        googleProof:
          type: string
          description: >-
            From `#/configuracoes?google=reauth-ok&proof=…` after a
            `GET /api/auth/google/start?intent=reauth` round trip. Single-use, 5 minutes,
            bound to this exact session.

    SessionUser:
      type: object
      description: The caller's identity, as returned by /api/me and the sign-in routes.
      properties:
        id: { type: string, description: Stable user id (16 base64url chars). }
        name: { type: string }
        admin: { type: boolean }
      example: { id: "Zk3q9XyPbA2LmN0v", name: "Ada", admin: false }

    # ------------------------------------------------------------------ WebAuthn
    # These mirror @simplewebauthn/server v13's JSON shapes (themselves the W3C
    # WebAuthn Level 3 JSON serialization). Clients normally never build them by
    # hand — @simplewebauthn/browser converts them to/from the navigator.credentials
    # calls. Documented loosely on purpose; the library owns the details.
    WebAuthnRegistrationOptions:
      type: object
      description: >-
        PublicKeyCredentialCreationOptionsJSON — pass to
        `startRegistration()` (@simplewebauthn/browser) or decode for
        `navigator.credentials.create()`. Resident keys are required; attestation
        is `none`.
      properties:
        challenge: { type: string, description: base64url }
        rp:
          type: object
          properties:
            name: { type: string }
            id: { type: string, description: The RP_ID the instance is configured with. }
        user:
          type: object
          properties:
            id: { type: string, description: base64url user handle }
            name: { type: string }
            displayName: { type: string }
        pubKeyCredParams: { type: array, items: { type: object } }
        authenticatorSelection:
          type: object
          properties:
            residentKey: { type: string, const: required }
            userVerification: { type: string, const: preferred }
        attestation: { type: string, const: none }
      additionalProperties: true

    WebAuthnRegistrationCredential:
      type: object
      description: >-
        RegistrationResponseJSON — the value `startRegistration()` resolves with
        (the created credential plus the authenticator's attestation response),
        sent back verbatim.
      properties:
        id: { type: string, description: base64url credential id }
        rawId: { type: string }
        type: { type: string, const: public-key }
        response:
          type: object
          properties:
            clientDataJSON: { type: string, description: base64url }
            attestationObject: { type: string, description: base64url }
            transports:
              type: array
              items: { type: string }
              description: e.g. ["internal", "hybrid"] — stored for later logins.
          additionalProperties: true
      additionalProperties: true

    WebAuthnAuthenticationOptions:
      type: object
      description: >-
        PublicKeyCredentialRequestOptionsJSON — pass to `startAuthentication()`.
        `allowCredentials` is empty: the browser offers the user's discoverable
        passkeys itself.
      properties:
        challenge: { type: string, description: base64url }
        rpId: { type: string }
        userVerification: { type: string, const: preferred }
        allowCredentials: { type: array, items: { type: object }, description: Always empty. }
      additionalProperties: true

    WebAuthnAuthenticationCredential:
      type: object
      description: >-
        AuthenticationResponseJSON — the value `startAuthentication()` resolves
        with, sent back verbatim.
      properties:
        id: { type: string, description: base64url credential id }
        rawId: { type: string }
        type: { type: string, const: public-key }
        response:
          type: object
          properties:
            clientDataJSON: { type: string }
            authenticatorData: { type: string }
            signature: { type: string }
            userHandle: { type: string }
          additionalProperties: true
      additionalProperties: true

    # ------------------------------------------------------------------ state sync
    State:
      type: object
      description: |
        The whole app state as one blob. The server treats it as opaque (it only
        strips `active` on save and reads a few fields for reminders and the admin
        dashboard) — the schema below is **representative, not enforced** (except
        `workouts` and `routines`, which must be arrays (or null) when present), and grows
        with the app. Concurrent writes are caught by the server's revision (`_rev`,
        see PUT /api/data); the client merges the two documents and decides by `_ts`
        which side's settings win.
      properties:
        _ts:
          type: number
          description: Client-set last-write timestamp (ms since epoch); drives sync.
        _rev:
          type: integer
          readOnly: true
          description: Server-set revision, incremented on every accepted PUT. Ignored when sent by a client.
        unit: { type: string, enum: [kg, lb] }
        lang:
          type: string
          description: UI language code ("en", "de", "pt", …) — also localizes pushes.
        theme: { type: string }
        accent: { type: string }
        workouts:
          type: array
          description: Completed workouts, chronological.
          items: { $ref: '#/components/schemas/Workout' }
        routines:
          type: array
          items: { $ref: '#/components/schemas/Routine' }
        week:
          type: object
          description: 'Weekly plan: weekday (0=Sunday … 6) → routine id.'
          additionalProperties: { type: string }
        dayPlan:
          type: object
          description: >-
            Per-date overrides: ISO date → routine id, or "rest". Wins over `week`.
          additionalProperties: { type: string }
        bodyweight:
          type: array
          items: { $ref: '#/components/schemas/BodyweightEntry' }
        customEx:
          type: array
          description: User-created exercises (id, name, muscles…).
          items: { $ref: '#/components/schemas/CustomExercise' }
        exWeights:
          type: object
          description: 'Per-exercise last/best weight memory: exercise id → {w, d}.'
          additionalProperties: { type: object, additionalProperties: true }
        reminder:
          type: object
          description: >-
            Daily "workout planned today" push. The server reads this: at `time`
            (HH:MM, in `tz`) it sends one push if a routine is planned and nothing
            was logged yet.
          properties:
            'on': { type: boolean }
            time: { type: string, example: "08:00" }
            tz:
              oneOf: [{ type: string }, { type: 'null' }]
              description: IANA zone ("Europe/Zurich"); the user's own clock.
        restSec: { type: number, description: Default rest-timer seconds. }
        effort:
          oneOf: [{ type: string, enum: [none, rir, rpe] }, { type: 'null' }]
        equipProfiles: { type: array, items: { type: object, additionalProperties: true } }
        settings:
          type: object
          description: >-
            Catch-all note: the remaining top-level keys (sound, keepAwake, gifSize,
            targetW, autoBackup, …) are flat settings values like the ones above.
          additionalProperties: true
      additionalProperties: true

    CustomExercise:
      type: object
      description: >-
        One exercise the user made (representative shape). The server stores it as sent and
        reads only `media` from it, to know which uploaded files are still referenced.
      properties:
        id: { type: string }
        n: { type: string, description: Name. }
        bp: { type: string, description: Body part. }
        custom: { type: boolean, const: true }
        media:
          $ref: '#/components/schemas/MediaRef'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            One link — a video or a guide. http(s) only, no credentials. Neither the app nor
            the server ever fetches it: the app opens it in a new browsing context on a tap.
        _ts: { type: number, description: 'When this entry was last edited, ms — for merging two devices'' copies.' }
      additionalProperties: true

    MediaRef:
      type: object
      description: >-
        What the state knows of an uploaded file. The bytes are behind
        `GET /api/media/{hash}`; the server keeps a file as long as some `customEx[].media.hash`,
        `workouts[].media[].hash` or `.poster.hash` of either in the profile's state names it, and
        for `MEDIA_GC_GRACE_DAYS` after.
      required: [kind, hash, mime, size, width, height, at]
      properties:
        kind: { type: string, enum: [image, gif, video], description: '`gif` means animated; a one-frame GIF is an `image`.' }
        hash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the stored file. }
        mime: { type: string, enum: [image/webp, image/jpeg, image/png, image/gif, video/mp4, video/quicktime, video/webm] }
        size: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1, maximum: 16384 }
        height: { type: integer, minimum: 1, maximum: 16384 }
        dur: { type: number, minimum: 0, maximum: 3600, description: 'Seconds, one decimal; videos and animated GIFs, absent when unknown.' }
        codec: { type: string, enum: [avc1, hvc1, av01, vp09, vp8, vp9, other], description: Videos only. }
        poster:
          type: object
          description: A still of at most 480 px — always for images and GIFs, when possible for videos.
          properties:
            hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            mime: { type: string, enum: [image/webp, image/jpeg] }
            size: { type: integer }
            width: { type: integer }
            height: { type: integer }
        at: { type: number, description: When it was attached, ms. }

    MediaConfig:
      type: object
      description: >-
        The instance's media caps (`MEDIA_*`), in MB of 2^20 bytes. Absent when the instance
        runs with `MEDIA_UPLOADS=0`.
      properties:
        imageMB: { type: number, description: 'A photo after the app re-encoded it, or a poster.' }
        gifMB: { type: number }
        videoMB: { type: number }
        videoSec: { type: number }
        quotaMB: { type: number, description: Per profile; 0 = no cap. }
        workouts:
          type: boolean
          const: true
          description: >-
            This instance keeps the files a logged workout's `media` list names too, not only a
            custom exercise's. Absent on an instance from before; the app then offers photos and
            videos on custom exercises only.
      example: { imageMB: 2, gifMB: 8, videoMB: 40, videoSec: 60, quotaMB: 200, workouts: true }

    MediaUsage:
      type: object
      properties:
        bytes: { type: integer, description: What the profile's stored files take. }
        count: { type: integer }
        quotaBytes: { type: integer, description: The cap; 0 = no cap. }

    MediaStored:
      type: object
      properties:
        ok: { type: boolean, const: true }
        hash: { type: string }
        mime: { type: string, description: 'What the bytes are — not necessarily what was declared.' }
        size: { type: integer }
        existed: { type: boolean, description: The server already had this file. }

    Workout:
      type: object
      description: One completed workout (representative shape).
      properties:
        id: { type: string }
        d: { type: string, format: date, description: 'ISO day, e.g. "2026-08-30".' }
        start: { type: number, description: ms since epoch }
        end: { type: number }
        routineId: { type: string }
        name: { type: string }
        bw: { type: number, description: 'Body weight that day, in `unit`.' }
        vol: { type: number, description: Total volume (Σ weight × reps). }
        prs:
          type: array
          items: { type: string }
          description: Exercise ids that hit a personal record.
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: Exercise id. }
              topW: { oneOf: [{ type: number }, { type: 'null' }] }
              sets:
                type: array
                items:
                  type: object
                  properties:
                    w: { type: number, description: Weight. }
                    r: { type: number, description: Reps. }
                    done: { type: boolean }
                    rir: { type: number }
                    rpe: { type: number }
                  additionalProperties: true
            additionalProperties: true
        media:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/MediaRef'
          description: >-
            Photos and videos attached to this workout (a progress photo, a form-check clip) —
            at most six in the app. Refs only; the bytes are behind `/api/media/{hash}`, and the
            server keeps every file any entry here names (the GC walks this list as it walks
            each custom exercise's `media`).
        _ts: { type: number, description: 'When this workout was last edited after it was logged, ms — for merging two devices'' copies.' }
      additionalProperties: true

    Routine:
      type: object
      description: A workout template (representative shape).
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        ex:
          type: array
          description: Exercises with set/rep targets.
          items: { type: object, additionalProperties: true }
      additionalProperties: true

    BodyweightEntry:
      type: object
      properties:
        d: { type: string, format: date }
        w: { type: number, description: Weight in `unit`. }
        t: { type: number, description: Timestamp (ms). }
      additionalProperties: true

    # ------------------------------------------------------------------ push
    PushSubscription:
      type: object
      description: The browser's PushSubscription.toJSON() — only these fields are stored.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          description: Public https:// push-service URL.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    # ------------------------------------------------------------------ admin
    AdminUserRow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
        disabled: { type: boolean }
        admin: { type: boolean }
        invitedBy:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The invite code this account was created with.
        lastSync:
          oneOf: [{ type: number }, { type: 'null' }]
          description: The state's `_ts` (ms).
        hasPush: { type: boolean, description: Has at least one push subscription. }
        online:
          type: boolean
          description: >-
            Currently training (an /api/activity heartbeat in the last ~70s). ISO-1447:
            which routine or how far into it is not an admin's to see — this used to be
            the full live-workout snapshot (`live`), now just the one bit.
        password:
          type: boolean
          description: PASSWORD_LOGIN instances only — the profile has a password.
        email:
          oneOf: [{ type: string }, { type: 'null' }]
          description: PASSWORD_LOGIN instances only — the e-mail the profile signs in with, if any.

    AdminUserDetail:
      type: object
      description: >-
        Account and subscription only (ISO-1447) — no routines, bodyweight, workouts or
        unit; `GET /api/admin/audit` and the Coach admin routes are the same way, carrying
        nothing of a user's training either.
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            created: { oneOf: [{ type: string }, { type: 'null' }] }
            disabled: { type: boolean }
            admin: { type: boolean }
            invitedBy: { oneOf: [{ type: string }, { type: 'null' }] }
            password: { type: boolean, description: PASSWORD_LOGIN instances only. }
            email:
              oneOf: [{ type: string }, { type: 'null' }]
              description: PASSWORD_LOGIN instances only — the sign-in e-mail, if any.
            resetUntil:
              oneOf: [{ type: number }, { type: 'null' }]
              description: PASSWORD_LOGIN instances only — expiry (ms) of an unused reset code.
        lastSync: { oneOf: [{ type: number }, { type: 'null' }] }
        subscription:
          description: >-
            The exact `GET /api/billing/status` shape for this account, or null while the
            instance has no Stripe configured.
          oneOf:
            - type: object
              properties:
                enabled: { type: boolean }
                status: { type: string, enum: [none, active, past_due, canceled, incomplete, incomplete_expired, unpaid] }
                active: { type: boolean }
                plan: { oneOf: [{ type: string, enum: [monthly, quarterly, yearly] }, { type: 'null' }] }
                firstPeriod: { type: boolean }
                since: { oneOf: [{ type: string, format: date-time }, { type: 'null' }], description: When this subscription row was created. }
                nextChargeDate: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
                nextChargeAmount: { oneOf: [{ type: integer, description: Centavos. }, { type: 'null' }] }
                cancelAtPeriodEnd: { type: boolean }
            - type: 'null'

    Invite:
      type: object
      properties:
        code: { type: string, description: 16 hex chars. }
        note: { type: string }
        createdBy: { type: string, description: Admin user id. }
        created: { type: string, description: ISO timestamp. }
        usedBy:
          oneOf: [{ type: string }, { type: 'null' }]
          description: User id that redeemed the code (absent/null while unused).
        usedAt: { type: string }
        usedByName:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Resolved display name (only in GET /api/admin/invites).
      additionalProperties: true

    Program:
      type: object
      description: >-
        An admin-curated training program — instance-wide catalog content, not a user's own
        training data (see docs/ADMIN_PROGRAMS.md). `rev` is optimistic concurrency: pass the
        value you last read back on every update/trash/cover call, or get `409 stale`.
      required: [id, title, description, category, difficulty, sessionMinutes, status, rev, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        category: { type: string, enum: [strength, hypertrophy, conditioning, mobility, general] }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        sessionMinutes: { type: integer, minimum: 1, maximum: 600, description: 'Estimated duration of one session, in minutes.' }
        status: { type: string, enum: [draft, published] }
        rev: { type: integer }
        coverFile: { type: string, description: '<sha256>.<ext> — present only once a cover is set.' }
        coverMime: { type: string, enum: [image/jpeg, image/png, image/webp] }
        coverWidth: { type: integer }
        coverHeight: { type: integer }
        coverBytes: { type: integer }
        coverAlt: { type: string, description: Required whenever a cover is present. }
        coverUpdatedAt: { type: string }
        coverUpdatedBy: { type: string, description: Admin user id (absent once that account is deleted). }
        createdAt: { type: string }
        createdBy: { type: string }
        createdByName: { type: string, description: Resolved display name (list/detail routes only). }
        updatedAt: { type: string }
        updatedBy: { type: string }
        updatedByName: { type: string }
        publishedAt: { type: string }
        deletedAt: { type: string, description: Present only for a program in the trash. }
        deletedBy: { type: string }
        deletedByName: { type: string }
      additionalProperties: false

    ProgramEvent:
      type: object
      description: One append-only row of a program's own audit trail (program_events).
      required: [id, programId, programTitle, action, actorName, at, changes]
      properties:
        id: { type: integer }
        programId: { type: string }
        programTitle: { type: string, description: Snapshot at the time of the event. }
        action:
          type: string
          enum: [create, update, publish, unpublish, cover_set, cover_remove, trash, restore, purge, purge_auto]
        actorId: { type: string, description: Absent once that admin account is deleted. }
        actorName: { type: string, description: 'Snapshot of the actor''s name at the time — or "system" for purge_auto.' }
        at: { type: string }
        changes:
          type: object
          description: '{field: [before, after]} for whatever moved; description collapses to the string "changed".'
      additionalProperties: false

    AuditEvent:
      type: object
      description: One line of the audit log.
      required: [id, ts, ev, ok]
      properties:
        id:
          type: integer
          description: Monotonic, never reset — a cleared log leaves a visible id gap.
        ts: { type: number, description: ms since epoch. }
        ev:
          type: string
          description: |
            Event name. Currently one of:
            `auth.register.ok|fail|denied`, `auth.login.ok|fail`, `auth.logout`,
            `auth.logout.all`, `auth.pair.create|ok|fail`,
            `admin.denied`, `admin.user.disable|enable`,
            `admin.invite.create|revoke`, `admin.audit.clear`.
        ok: { type: boolean, description: false for failed/denied attempts. }
        uid: { type: string, description: Acting (or affected) user id. }
        name: { type: string, description: Acting user's name (max 40 chars). }
        tgt: { type: string, description: Target user id (admin actions). }
        tname: { type: string, description: Target user's name. }
        msg:
          type: string
          description: >-
            Short detail — a failure reason code, or the invite code involved.
            Rejected invite guesses and unknown credential ids are deliberately
            never recorded.
        ip:
          type: string
          description: >-
            Only when AUDIT_IP is on — the full address (`full`) or just the
            network, /24 or /48 (`net`).
      example:
        id: 421
        ts: 1756500000000
        ev: auth.login.ok
        ok: true
        uid: Zk3q9XyPbA2LmN0v
        name: Ada

    # ------------------------------------------------------------------ AI Coach
    CoachCap:
      type: object
      description: What this profile has spent of its daily allowance.
      properties:
        used: { type: integer }
        limit: { type: integer, description: 0 means no per-profile cap. }

    CoachStatus:
      type: object
      properties:
        job:
          oneOf:
            - type: object
              properties:
                id: { type: string }
                kind: { type: string, enum: [create, review, debrief] }
                state: { type: string, enum: [queued, running] }
                startedAt: { type: integer, description: Epoch ms. }
            - type: 'null'
          description: The job running now, or null. One at a time per profile.
        pending:
          oneOf:
            - $ref: '#/components/schemas/CoachProposal'
            - type: 'null'
        cap: { $ref: '#/components/schemas/CoachCap' }
        maxMessageLen:
          type: integer
          minimum: 200
          maximum: 4000
          description: |
            The longest note or refinement this instance keeps, in characters. It rides on the
            poll so a chat that is already open follows an admin's change.
        last:
          oneOf:
            - type: object
              description: How the most recent job ended, so the chat can say so in the Coach's own voice.
              properties:
                id: { type: string }
                kind: { type: string, enum: [create, review, debrief] }
                outcome: { type: string, enum: [ready, nochange, applied, dismissed, expired, failed] }
                errorClass:
                  oneOf: [{ type: string }, { type: 'null' }]
                  description: e.g. `provider`, `unusable`, `restart`, `forgotten`, `consent`, `noworkout`.
                at: { type: integer, description: Epoch ms. }
                reading: { type: string, description: "Present on `nochange` — why there was nothing to change." }
            - type: 'null'

    CoachProposal:
      type: object
      description: |
        The answer waiting for a decision, from whichever kind of job produced it. It
        expires 14 days after it was made; the first status poll after that retires it.
        `changes` comes from a review, `bundle` from a plan, `score`/`highlights` from a
        debrief — one of the three, never more.
      properties:
        id: { type: string, description: The job's id. }
        kind: { type: string, enum: [create, review, debrief] }
        createdAt: { type: integer, description: Epoch ms. }
        expiresAt: { type: integer, description: Epoch ms. }
        planHash: { type: string, description: The plan this was written against — a later edit makes it stale. }
        iteration: { type: integer, description: "1, or higher after a refine." }
        summary: { type: string, maxLength: 1200 }
        changes:
          type: array
          description: A review's change-set, each one applied or rejected on its own.
          items:
            type: object
            properties:
              id: { type: string }
              type:
                type: string
                enum: [add-exercise, remove-exercise, swap-exercise, sets, reps, repsMin, repsMax,
                       sec, cardio, reorder, superset, routine-prog, exercise-prog, inc,
                       add-routine, remove-routine, rename-routine, week]
              why: { type: string }
              before: { description: What the plan says now — the client checks it before applying. }
              after: { description: What it would say. }
            additionalProperties: true
        evidence:
          type: object
          description: The window the review read.
          properties:
            from: { oneOf: [{ type: string }, { type: 'null' }] }
            to: { oneOf: [{ type: string }, { type: 'null' }] }
            sessions: { oneOf: [{ type: integer }, { type: 'null' }] }
        notes:
          type: array
          items: { type: string }
        bundle:
          type: object
          description: A whole plan, from a `create` job — routines, week and any custom exercises.
          properties:
            opengym_plan: { type: integer, const: 1 }
            name: { type: string, maxLength: 40 }
            summary: { type: string }
            basedOn: { type: string }
            week: { type: object }
            routines: { type: array, items: { type: object } }
            customEx: { type: array, items: { type: object } }
          additionalProperties: true
        score: { type: integer, minimum: 1, maximum: 10, description: A debrief's score for the session. }
        highlights: { type: array, items: { type: string } }
        watch: { type: array, items: { type: string } }
        nextTime: { type: array, items: { type: string } }
        workout:
          type: object
          description: Which session a debrief read.
          additionalProperties: true
      additionalProperties: true

    CoachIntake:
      type: object
      description: >-
        The intake answers, as the plan screen collects them. Stored in the profile's own
        state as well; sent here so a plan can be asked for with answers that have not
        been synced yet.
      properties:
        goal: { type: string, description: "e.g. `muscle`, `strength`, `fat-loss`." }
        experience: { type: string }
        daysPerWeek: { type: integer }
        preferredDays: { type: array, items: { type: integer }, description: 0 = Sunday. }
        sessionMin: { type: integer, description: Minutes per session. }
        equipment: { type: array, items: { type: string } }
        limitations: { type: string, description: Injuries and anything to work around. }
      additionalProperties: true

    CoachCohort:
      type: object
      description: |
        Medians across the profiles that opted in, and where this one stands among them.
        `ok` is false whenever there is nothing to show, and the other flags say why:
        the admin has the comparison switched off (`enabled: false`), this profile does
        not share (`sharing: false`), or there are not yet three who do.
      properties:
        ok: { type: boolean }
        enabled: { type: boolean }
        sharing: { type: boolean }
        people: { type: integer }
        minPeople: { type: integer, description: Three. Below it nothing is computed at all. }
        unit: { type: string, enum: [kg, lb], description: The reader's own unit — every number below is in it. }
        sessionsPerWeek:
          type: object
          properties:
            median: { type: number }
            you: { type: number }
        exercises:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              people: { type: integer }
              median: { oneOf: [{ type: number }, { type: 'null' }] }
              you: { oneOf: [{ type: number }, { type: 'null' }] }
        rankPct:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: Share of the others at or below this profile, averaged over the listed exercises.

    AdminCoach:
      type: object
      description: The whole admin card in one answer. Never a credential — only whether one is filed.
      properties:
        disabledByEnv: { type: boolean, description: "COACH_DISABLED is set, so nothing the admin toggles matters." }
        enabled: { type: boolean }
        provider: { type: string }
        providers:
          type: array
          description: Every provider this build knows, and what each one needs.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              runtime: { type: string, description: "The runtime it spawns, when it spawns one." }
              setupToken: { type: boolean }
              deviceLogin: { type: boolean }
              apiKey: { type: boolean }
              http: { type: boolean }
              baseUrl: { type: boolean, description: Whether its endpoint is configurable. }
              keyOptional: { type: boolean }
              keyPlaceholder: { oneOf: [{ type: string }, { type: 'null' }] }
              defaultModel: { oneOf: [{ type: string }, { type: 'null' }] }
              connected: { type: boolean, description: Whether a credential is already filed for it. }
        model: { type: string, description: The model in force for the active provider. }
        models: { type: object, description: Model per provider — switching provider keeps them all. }
        baseUrl: { oneOf: [{ type: string }, { type: 'null' }] }
        knownModels:
          oneOf: [{ type: array, items: { type: string } }, { type: 'null' }]
          description: From the live check, when the provider could be asked.
        caps:
          type: object
          properties:
            perProfileDaily: { type: integer }
            instanceDaily: { type: integer }
        maxMessageLen: { type: integer, description: 'How long a chat message, refinement or review note can be (200–4000, default 1000).' }
        community: { type: boolean }
        runtime:
          type: object
          description: The live check performed while answering this request.
          properties:
            ok: { type: boolean }
            version: { oneOf: [{ type: string }, { type: 'null' }] }
            error: { oneOf: [{ type: string }, { type: 'null' }] }
            needsKey: { type: boolean }
        authMode: { type: string, enum: [instance, profile] }
        boundUid:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The profile an instance credential bound itself to, once one has spent it.
        auth:
          type: object
          description: >-
            Whether a credential is filed, and whose. `unreadable` is its own state because it
            has a specific cause and a specific fix — ./data restored without its `secret`.
          properties:
            state: { type: string, enum: [not-required, none, optional, connected, unreadable] }
            type: { oneOf: [{ type: string }, { type: 'null' }] }
            account: { oneOf: [{ type: string }, { type: 'null' }] }
            connectedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        unprivileged:
          type: object
          description: >-
            Whether the privilege drop can be performed. It fails closed: if `ok` is false no
            job runs at all, and the admin needs to hear that here rather than from a user.
          properties:
            ok: { type: boolean }
            dropped: { type: boolean }
            why: { type: string }
        jobsToday: { type: integer }
        lastSuccess: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        lastError: { description: "The last failure the instance log recorded, or null." }
        recent:
          type: array
          description: The last 20 jobs, newest first — counts and outcomes only, never contents.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind: { type: string }
              trigger: { type: string, enum: [manual, scheduled] }
              outcome: { type: string }
              errorClass: { oneOf: [{ type: string }, { type: 'null' }] }
              ms: { type: integer }

    TeacherAssignmentBrief:
      type: object
      description: What a teacher sees of a student's current or past assignment — never the full payload.
      properties:
        id: { type: string }
        kind: { type: string, enum: [routine, program] }
        startsOn: { type: string }
        days:
          oneOf: [{ type: 'null' }, { type: array, items: { type: integer } }]
        name:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The routine's own name, or the Program's title.

    TeacherAssignmentHistoryEntry:
      type: object
      properties:
        kind: { type: string, enum: [routine, program] }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        startsOn: { type: string }
        endedAt: { type: string }
        endReason: { type: string, enum: [replaced, ended, unlinked, role-revoked] }

    TeacherStudentSummary:
      type: object
      properties:
        id: { type: string }
        name: { oneOf: [{ type: string }, { type: 'null' }] }
        acceptedAt: { type: string }
        assignment:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TeacherAssignmentBrief' }]
        summary: { $ref: '#/components/schemas/StudentSummary' }

    StudentSummary:
      type: object
      description: studentSummary() (api/teacher.js) — computed over teacherView, never the raw state.
      properties:
        lastWorkoutAt: { oneOf: [{ type: string }, { type: 'null' }] }
        workoutsThisWeek: { type: integer }
        adherence:
          description: >-
            null with no active assignment, a Program, or no fixed days — the UI then shows
            only workoutsThisWeek.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                done: { type: integer }
                expected: { type: integer }
                ratio: { type: number }
        idleDays: { oneOf: [{ type: integer }, { type: 'null' }] }
        idle: { type: boolean, description: 'idleDays >= 7.' }

    TeacherStudentDetail:
      type: object
      description: teacherView(state, opts) plus the link's own metadata, the summary and the assignment history.
      properties:
        unit: { type: string, enum: [kg, lb] }
        workouts: { type: array, items: { type: object } }
        routines: { type: array, items: { type: object } }
        customEx: { type: array, items: { type: object } }
        bodyweight:
          type: array
          description: Present only when shareBodyweight is true.
          items: { type: object, properties: { d: { type: string }, w: { type: number } } }
        scopeVersion: { type: integer }
        shareBodyweight: { type: boolean }
        summary: { $ref: '#/components/schemas/StudentSummary' }
        assignment:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TeacherAssignmentBrief' }]
        assignmentHistory:
          type: array
          items: { $ref: '#/components/schemas/TeacherAssignmentHistoryEntry' }

    TeacherNote:
      type: object
      properties:
        id: { type: string }
        body: { type: string }
        created: { type: string }
        updated: { type: string }

    TeacherAssignmentDelivery:
      type: object
      description: Everything the student's own client needs to import the routine, or notice it ended (D8) — no server-side lookups.
      properties:
        id: { type: string }
        kind: { type: string, enum: [routine, program] }
        payload:
          type: object
          description: The validated routine snapshot (kind "routine") or { programId } (kind "program").
        startsOn: { type: string }
        days:
          oneOf: [{ type: 'null' }, { type: array, items: { type: integer } }]
        endedAt: { oneOf: [{ type: string }, { type: 'null' }] }
        endReason:
          oneOf: [{ type: 'null' }, { type: string, enum: [replaced, ended, unlinked, role-revoked] }]
