name: opengym

services:
  # PostgreSQL (Phase 1, ISO-1387/1402/1403). The API connects and migrates against this at boot
  # and it is the source of truth for everything db.json and state-<uid>.json used to hold — an
  # instance upgrading from before ISO-1403 has its old ./data/db.json and state-*.json files
  # imported here once, at that first boot. No port published: only the api service on this
  # compose network ever needs to reach it.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opengym}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opengym}
      - POSTGRES_DB=${POSTGRES_DB:-opengym}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opengym} -d ${POSTGRES_DB:-opengym}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/anisotton/opengym-api:latest
    # Default target: no AI runtime, no AI dependency — the image every instance has always had.
    # To opt into the AI Coach, build the other target instead:
    #     API_TARGET=coach docker compose up --build api
    # `--build` matters: with an `image:` also set, compose would otherwise pull the prebuilt
    # default rather than build the coach one.
    build:
      context: ./api
      target: ${API_TARGET:-default}
      # Unset, these three default to "dev"/"dev"/"unknown" (the Dockerfile's own ARG defaults)
      # — the image's org.opencontainers.image.revision label then says "dev" no matter what was
      # actually built, which is exactly what made the Lyra incident (ISO-1479) take longer to
      # pin down than it should have. Export VCS_REF (and ideally VERSION/BUILD_DATE) from git
      # before `docker compose build`/`up --build` so a later `docker inspect` can say which
      # commit is actually running.
      args:
        VERSION: ${VERSION:-dev}
        VCS_REF: ${VCS_REF:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # The port the API listens on. web proxies to this same value, so the two
      # cannot drift — change it in .env and both follow.
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      # Connects to the `db` service above by its compose service name — always reachable there,
      # since compose only starts api once db reports healthy.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opengym}:${POSTGRES_PASSWORD:-opengym}@db:5432/${POSTGRES_DB:-opengym}
      # The API is reachable only through the web container here, and that container overwrites
      # X-Forwarded-For / X-Real-IP with the real peer — so the sign-in throttle may count
      # requests by those headers instead of lumping everyone in as "the web container".
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # The public address of this instance (e-mail links, Stripe return URLs). Defaults to
      # ORIGIN, which is right for almost everyone — only set it separately if the API is ever
      # reachable at a different public address than the web origin.
      - APP_URL=${APP_URL:-${ORIGIN}}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
                             # (and uploads/: the photos and videos of custom exercises)
      # Provider credential cache (Codex). A sibling of ./data on purpose: the documented backup
      # is `tar czf … data/`, and a live refresh token must not end up inside it. Nothing here
      # needs backing up — if you lose it, sign the provider in again.
      - ./coach-auth:/coach-auth

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api.
  # Single origin for passkeys.
  web:
    image: ghcr.io/anisotton/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        VCS_REF: ${VCS_REF:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    # nginx renders its config at start-up from these (web/nginx.conf.template),
    # so the API service does not have to be called `api`. Defaults are the old
    # hardcoded values, so an existing .env and an existing stack are unaffected.
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      # Docker's embedded DNS. Only ever needs changing on a runtime that is not Docker.
      - RESOLVER=${RESOLVER:-127.0.0.11}
      # Empty drops the CF-Connecting-IP header, so a direct client cannot forge the address
      # the activity log records. Cloudflare users set CF_CONNECTING_IP=$$http_cf_connecting_ip.
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      # Subpath deployments behind a proxy that passes its prefix through ("/gym", no trailing
      # slash). Empty serves the app at the site root, which is what it has always done; a proxy
      # that strips the prefix needs nothing set (docs/SELF_HOSTING.md §5).
      - BASE_PATH=${BASE_PATH:-}
      # The largest photo or video upload nginx passes to the API. Keep it above
      # MEDIA_VIDEO_MAX_MB (40 by default), which the api service reads from .env.
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}
      # The public address of this instance. The entrypoint substitutes it into the served
      # index.html's og:url/og:image tags — no rebuild per environment.
      - APP_URL=${APP_URL:-${ORIGIN}}

volumes:
  pgdata:
