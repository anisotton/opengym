# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'scripts/build-coach-assets.mjs'
      - 'scripts/build-coach-library.mjs'
      - 'api/coach/prompts/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, coach]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'scripts/build-coach-assets.mjs'
      - 'scripts/build-coach-library.mjs'
      - 'api/coach/prompts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend


  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp

  api:
    runs-on: ubuntu-latest
    # Since ISO-1403 the api keeps profile state in PostgreSQL: server.js exits at boot without
    # DATABASE_URL, and every test that spawns it (or drives store.js directly) provisions its own
    # database per file from TEST_DATABASE_URL — the contract api/test/helpers.mjs defines and
    # api/scripts/test-with-pg.sh fulfils locally. This service is the CI counterpart of that
    # script: a throwaway server whose maintenance database the tests CREATE theirs under.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opengym
          POSTGRES_PASSWORD: opengym
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opengym -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://opengym:opengym@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # The Coach tests run on node:test and drive the in-repo fixture provider plus a local mock
      # of the Chat Completions shape, so the job needs no AI account and no network — but it does
      # need the api's own dependencies since the server-side fetch moved onto undici (same
      # install as test:api in .gitlab-ci.yml; the Agent SDK is optional and stays out).
      - run: npm ci --omit=optional
        working-directory: api
      - run: npm test
        working-directory: api
      # The api's copy of the exercise catalogue is generated and committed. A dataset change
      # that forgets to regenerate it would otherwise only surface as "the Coach can't find
      # that exercise" on somebody's instance.
      - run: node scripts/build-coach-assets.mjs --check
      - run: node api/scripts/check-core-loadable.mjs

  # Builds *and runs* both image targets. Building alone would not have caught the api image
  # shipping without coach/ — that image built perfectly and exited on boot. So each target has
  # to answer for itself: the default one starts and serves, and the coach one additionally
  # resolves the Agent SDK's per-platform runtime (musl on this base), which is the one thing
  # that cannot be checked from the source tree.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build --target default -t opengym-api:default ./api
      - run: docker build --target coach   -t opengym-api:coach   ./api
      # No --target, exactly like docker-publish.yml. That workflow names no stage, so what it
      # ships is whatever Dockerfile stage happens to be last -- and that untargeted artifact,
      # not opengym-api:default above, is the image every self-hoster pulls as :latest. Build it
      # the same way here so the assertion below is about the thing we actually publish.
      - run: docker build -t opengym-api:published ./api

      - name: the image published as :latest has no AI runtime either
        run: |
          docker run --rm opengym-api:published node -e \
            'import("@anthropic-ai/claude-agent-sdk").then(()=>{console.error("AI runtime present in the published image -- the last Dockerfile stage is no longer the runtime-free one");process.exit(1)},()=>process.exit(0))'
          ! docker run --rm opengym-api:published codex --version
          ! docker run --rm opengym-api:published bwrap --version

      - name: the default image boots and serves, with no AI runtime in it
        run: |
          # The api exits at boot without DATABASE_URL (PostgreSQL holds profile state since
          # ISO-1403), so the image under test gets a throwaway database on a private network —
          # the same shape docker-compose.yml gives a real instance, minus the volume.
          docker network create api-ci
          docker run -d --name api-ci-pg --network api-ci \
            -e POSTGRES_USER=opengym -e POSTGRES_PASSWORD=opengym -e POSTGRES_DB=opengym \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec api-ci-pg pg_isready -U opengym -d opengym >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name api-default --network api-ci -e DATA_DIR=/data \
            -e DATABASE_URL=postgresql://opengym:opengym@api-ci-pg:5432/opengym \
            -p 3000:3000 opengym-api:default
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/config >/dev/null 2>&1 && break
            sleep 1
          done
          # On failure the container's own last words are the diagnosis, not curl's exit code.
          curl -fsS http://localhost:3000/api/config | tee /dev/stderr | grep -q '"invite_only"' \
            || { echo '--- api-default logs ---' >&2; docker logs api-default >&2; exit 1; }
          # Absent by construction, not by accident: --omit=optional is the only thing keeping
          # the AI dependency out of the image an owner gets when they never asked for it.
          docker run --rm opengym-api:default node -e \
            'import("@anthropic-ai/claude-agent-sdk").then(()=>{console.error("AI runtime present in the default image");process.exit(1)},()=>process.exit(0))'
          docker rm -f api-default api-ci-pg
          docker network rm api-ci

      - name: the coach image carries a runnable Agent SDK
        run: |
          docker run --rm opengym-api:coach node --input-type=module -e '
            const { adapterFor } = await import("./coach/adapters/index.js");
            const r = await adapterFor("claude").check();
            if (!r.ok) { console.error(r.error); process.exit(1); }
            console.log(r.version);
          '

      - name: the coach image carries the Codex runtime and its sandbox
        run: |
          docker run --rm opengym-api:coach codex --version
          docker run --rm opengym-api:coach bwrap --version
          # Owned by the user jobs drop to, and 0700 — a credential cache readable by anything
          # else in the container would undo the point of dropping privileges at all.
          test "$(docker run --rm opengym-api:coach stat -c '%U %a' /coach-auth)" = "coach 700"

      - name: neither Codex nor its sandbox is in the default image
        run: |
          # bubblewrap is a Codex requirement, so an owner who never opted in should not be
          # carrying it. Both commands must fail.
          ! docker run --rm opengym-api:default codex --version 2>/dev/null
          ! docker run --rm opengym-api:default bwrap --version 2>/dev/null

      - name: the privilege drop can actually be performed in the image
        run: |
          # canDropPrivileges() fails closed, so a missing `coach` user disables every job —
          # including the fixture provider. Cheaper to assert here than to discover on an instance.
          docker run --rm opengym-api:default id coach
